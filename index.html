<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRASILEIRÃO ARENA 2026 - Top-Down</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>

        <div id="ui-layer">
            <!-- Screen: Menu -->
            <div id="menu-screen" class="screen active">
                <div class="logo">
                    <h1>BRASILEIRÃO <span>ARENA 2026</span></h1>
                    <p class="type">TOP-DOWN STRIKER</p>
                </div>

                <div class="team-selection">
                    <p>ESCOLHA SEU TIME:</p>
                    <div id="team-grid" class="team-grid"></div>
                </div>
            </div>

            <!-- Screen: Phase Intro -->
            <div id="intro-screen" class="screen">
                <h2 id="phase-title">OITAVAS DE FINAL</h2>
                <div class="match-info">
                    <div id="p-team-card" class="team-card">TIME</div>
                    <div class="vs">VS</div>
                    <div class="team-card">ZAGUEIROS</div>
                </div>
                <button id="start-btn" class="action-btn">ENTRAR EM CAMPO</button>
            </div>

            <!-- HUD -->
            <div id="hud" class="hud hidden">
                <div class="top-bar">
                    <div id="phase-tag" class="tag">OITAVAS</div>
                    <div class="score-display">GOLS: <span id="current-score">0</span> / 3</div>
                    <div id="team-name-tag" class="tag">PALMEIRAS</div>
                </div>
                <div class="controls-hint">WASD PARA MOVER | ESPAÇO PARA CHUTAR PERTO DO GOL</div>
            </div>

            <!-- Screen: Result/Victory -->
            <div id="result-screen" class="screen">
                <h1 id="result-text">VITÓRIA!</h1>
                <p id="next-phase-info">RUMO ÀS QUARTAS</p>
                <button id="advance-btn" class="action-btn">PRÓXIMA FASE</button>
                <button id="retry-btn" class="action-btn hidden" onclick="location.reload()">TENTAR NOVAMENTE</button>
            </div>

            <!-- Screen: Champion -->
            <div id="finale-screen" class="screen">
                <div class="trophy">🏆</div>
                <h1>CAMPEÃO NACIONAL</h1>
                <h2 id="champ-team">TIME</h2>
                <button onclick="location.reload()" class="action-btn">MENU INICIAL</button>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>

</html>
