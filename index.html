<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRASILEIRÃO PENALTY STRIKE 2026 - V 4.0 SUPREMO</title>
    <style>
        :root {
            --neon: #00ff88;
            --pitch: #081a09;
            --hud-dark: rgba(0, 0, 0, 0.92);
            --p-color: #00ff88;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game-frame {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1280px;
            max-height: 720px;
            overflow: hidden;
            border: 4px solid #111;
            box-shadow: 0 0 50px rgba(0, 0, 0, 1);
        }

        canvas {
            display: block;
            background: var(--pitch);
            cursor: none;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.98);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .screen.active {
            display: flex;
        }

        h1 {
            font-size: 4.5rem;
            font-weight: 950;
            text-transform: uppercase;
            margin-bottom: 2rem;
            line-height: 0.85;
        }

        h1 span {
            color: var(--neon);
            text-shadow: 0 0 30px var(--neon);
        }

        .grid-teams {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            width: 95%;
            max-width: 1000px;
            max-height: 420px;
            overflow-y: auto;
            background: #080808;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #222;
        }

        .club-btn {
            background: #151515;
            border: 2px solid #222;
            color: #fff;
            padding: 18px;
            font-weight: 900;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.25s;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .club-btn:hover {
            border-color: var(--neon);
            transform: translateY(-4px);
            background: #1a1a1a;
            box-shadow: 0 5px 20px rgba(0, 255, 136, 0.2);
        }

        .diff-group {
            margin-bottom: 2.5rem;
            display: flex;
            gap: 15px;
        }

        .diff-btn {
            background: #111;
            border: 2px solid #333;
            color: #fff;
            padding: 12px 25px;
            font-weight: 800;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }

        .diff-btn.active {
            border-color: var(--neon);
            background: rgba(0, 255, 136, 0.05);
        }

        .btn-action {
            background: var(--neon);
            color: #000;
            border: none;
            padding: 1.5rem 5rem;
            font-size: 2rem;
            font-weight: 950;
            border-radius: 60px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 2rem;
            transition: 0.3s;
        }

        .btn-action:hover {
            transform: scale(1.1);
            box-shadow: 0 0 40px var(--neon);
        }

        .hud-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 90px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px;
            pointer-events: none;
            z-index: 50;
        }

        .hud-card {
            background: var(--hud-dark);
            border-bottom: 5px solid var(--p-color);
            padding: 12px 35px;
            border-radius: 8px;
            font-weight: 950;
            font-size: 1.4rem;
        }

        .score-board {
            font-size: 4rem;
            font-weight: 950;
            color: #fff;
            filter: drop-shadow(0 0 10px var(--neon));
        }

        .msg-pop {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 9rem;
            font-weight: 950;
            font-style: italic;
            z-index: 80;
            text-transform: uppercase;
            text-shadow: 0 0 40px rgba(0, 0, 0, 1);
            pointer-events: none;
            opacity: 0;
            transition: 0.15s;
        }

        .goal-flash-fx {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 40;
        }

        .flash-active {
            animation: flash-seq 0.4s ease-out;
        }

        @keyframes flash-seq {
            0% {
                opacity: 0.7;
            }

            100% {
                opacity: 0;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--neon);
            border-radius: 10px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body id="body-main">
    <div id="game-frame">
        <!-- Tópico 4 & 24: Visual Arena -->
        <div id="flash-overlay" class="goal-flash-fx"></div>
        <canvas id="game-canvas"></canvas>

        <!-- Tópico 16: HUD -->
        <div id="hud-main" class="hud-top hidden">
            <div class="hud-card" id="p-name">PALMEIRAS</div>
            <div class="score-board"><span id="p-goals">0</span> : <span id="c-goals">0</span></div>
            <div class="hud-card" id="c-name">CPU</div>
        </div>

        <div id="status-msg" class="msg-pop">GOOOL!</div>

        <!-- Tópico 3: Menu -->
        <div id="screen-start" class="screen active">
            <h1>PENALTY <span>STRIKE 2026</span></h1>

            <div class="diff-group">
                <button class="diff-btn active" data-diff="normal">NORMAL</button>
                <button class="diff-btn" data-diff="hard">HARD</button>
                <button class="diff-btn" data-diff="super">SUPER HARD</button>
            </div>

            <p style="margin-bottom: 20px; font-weight: 900; opacity: 0.5;">SELECIONE SEU CLUBE SÉRIE A:</p>
            <div class="grid-teams" id="team-selector"></div>
        </div>

        <!-- Tópico 10: Campeonato -->
        <div id="screen-stage" class="screen">
            <p id="stage-title"
                style="font-weight: 900; color: var(--neon); letter-spacing: 12px; margin-bottom: 1rem; font-size: 1.2rem;">
                OITAVAS DE FINAL</p>
            <h1 id="match-label">JOGADOR VS CPU</h1>
            <button class="btn-action" id="enter-pitch">ENTRAR EM CAMPO</button>
        </div>

        <!-- Tópico 19: Resultado -->
        <div id="screen-winloss" class="screen">
            <h1 id="winloss-header">VITÓRIA!</h1>
            <p id="winloss-sub" style="font-size: 1.8rem; opacity: 0.6;">AVANÇANDO PARA A PRÓXIMA FASE</p>
            <button class="btn-action" id="next-stage-btn">CONTINUAR</button>
            <button class="btn-action hidden" id="restart-tourney" onclick="location.reload()">RECOMEÇAR
                TORNEIO</button>
        </div>

        <!-- Finale -->
        <div id="screen-trophy" class="screen">
            <div style="font-size: 10rem; margin-bottom: 1rem;">✨🏆✨</div>
            <h1>LENDA DO <span>BRASILEIRÃO 2026</span></h1>
            <h2 id="champ-club" style="font-size: 3rem;">TIME CAMPEÃO</h2>
            <button class="btn-action" onclick="location.reload()">MENU PRINCIPAL</button>
        </div>
    </div>

    <script>
        /**
         * BRASILEIRÃO PENALTY STRIKE 2026 - V 4.0 SUPREMO
         * PROTOCOLO DE ENGENHARIA 25 PONTOS
         */

        const CLUBS_DATA = [
            { id: 0, name: "Palmeiras", color: "#006400" }, { id: 1, name: "Flamengo", color: "#ff0000" },
            { id: 2, name: "Botafogo", color: "#000000" }, { id: 3, name: "Fortaleza", color: "#001e9c" },
            { id: 4, name: "São Paulo", color: "#ff0000" }, { id: 5, name: "Internacional", color: "#e30613" },
            { id: 6, name: "Cruzeiro", color: "#003399" }, { id: 7, name: "Bahia", color: "#005baa" },
            { id: 8, name: "Corinthians", color: "#ffffff" }, { id: 9, name: "Vasco", color: "#000000" },
            { id: 10, name: "Grêmio", color: "#00aae4" }, { id: 11, name: "Atlético-MG", color: "#000000" },
            { id: 12, name: "Fluminense", color: "#800020" }, { id: 13, name: "Athletico-PR", color: "#cc0000" },
            { id: 14, name: "Vitória", color: "#ff0000" }, { id: 15, name: "Bragantino", color: "#ffffff" },
            { id: 16, name: "Santos", color: "#ffffff" }, { id: 17, name: "Coritiba", color: "#006400" },
            { id: 18, name: "Mirassol", color: "#ffff00" }, { id: 19, name: "Remo", color: "#000080" }
        ];

        const TOURNEY_STAGES = ["Oitavas de Final", "Quartas de Final", "Semifinal", "Grande Final"];

        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        let cw, ch;

        // Tópico 2: Input State
        const inputMap = {};
        window.onkeydown = (e) => { inputMap[e.code] = true; };
        window.onkeyup = (e) => { inputMap[e.code] = false; };

        // Tópico 25: Máquina de Estados (FSM)
        // States: MENU, INTRO, MIRANDO, CHUTANDO, RESULTADO, TRANSICAO, FINALE
        let gState = 'MENU';
        let pClub = null;
        let cClub = null;
        let diffLevel = 'normal';
        let stageCount = 0;
        let scorePlayer = 0;
        let scoreCPU = 0;
        let currentTurn = 'PLAYER'; // PLAYER ou CPU
        let isTransitioning = false; // Tópico 23

        // Objetos
        const football = { x: 0, y: 0, r: 18, startX: 0, startY: 0, targetX: 0, targetY: 0, t: 0, active: false, blocked: false };
        const reticle = { x: 0, y: 0, r: 35, time: 0 };
        const arqueiro = { x: 0, y: 0, w: 120, h: 52, targetX: 0 };
        const particles = []; // Tópico 24

        function setup() {
            onResize();
            window.addEventListener('resize', onResize);

            // Build Menu
            const grid = document.getElementById('team-selector');
            CLUBS_DATA.forEach(club => {
                const b = document.createElement('button');
                b.className = 'club-btn';
                b.innerText = club.name;
                b.onclick = () => initSelection(club);
                grid.appendChild(b);
            });

            document.querySelectorAll('.diff-btn').forEach(b => {
                b.onclick = () => {
                    document.querySelectorAll('.diff-btn').forEach(x => x.classList.remove('active'));
                    b.classList.add('active');
                    diffLevel = b.dataset.diff;
                };
            });

            document.getElementById('enter-pitch').onclick = beginMatch;
            document.getElementById('next-stage-btn').onclick = goToNextPhase;

            // Tópico 1: Engine Loop
            mainLoop();
        }

        function onResize() {
            cw = canvas.width = window.innerWidth;
            ch = canvas.height = window.innerHeight;
            if (ch > 720) ch = canvas.height = 720;
            if (cw > 1280) cw = canvas.width = 1280;
        }

        function initSelection(club) {
            pClub = club;
            document.documentElement.style.setProperty('--p-color', club.color);
            prepareIntro();
        }

        function prepareIntro() {
            cClub = CLUBS_DATA[Math.floor(Math.random() * CLUBS_DATA.length)];
            while (cClub.name === pClub.name) cClub = CLUBS_DATA[Math.floor(Math.random() * CLUBS_DATA.length)];

            document.getElementById('stage-title').innerText = TOURNEY_STAGES[stageCount].toUpperCase();
            document.getElementById('match-label').innerText = `${pClub.name.toUpperCase()} VS ${cClub.name.toUpperCase()}`;
            setFSM('INTRO');
        }

        function setFSM(st) {
            gState = st;
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));

            if (st === 'MENU') document.getElementById('screen-start').classList.add('active');
            else if (st === 'INTRO') document.getElementById('screen-stage').classList.add('active');
            else if (st === 'TRANSICAO') document.getElementById('screen-winloss').classList.add('active');
            else if (st === 'FINALE') document.getElementById('screen-trophy').classList.add('active');
            else if (st === 'MIRANDO') {
                canvas.focus(); // Tópico 20
                document.getElementById('hud-main').classList.remove('hidden');
            }
        }

        function beginMatch() {
            scorePlayer = 0; scoreCPU = 0; // Tópico 11
            syncHUD();
            startNewTurn();
        }

        function startNewTurn() {
            isTransitioning = false;
            football.active = false;
            football.blocked = false;
            football.t = 0;
            football.x = cw / 2;
            football.y = ch * 0.9;
            football.startX = football.x;
            football.startY = football.y;

            reticle.x = cw / 2;
            reticle.y = ch * 0.35;

            arqueiro.x = cw / 2 - arqueiro.w / 2;
            arqueiro.y = ch * 0.22;
            arqueiro.targetX = arqueiro.x;

            document.getElementById('status-msg').style.opacity = '0';
            setFSM('MIRANDO');

            if (currentTurn === 'CPU') {
                setTimeout(launchChute, 1500);
            }
        }

        function mainLoop() {
            updateWorld();
            drawFrame();
            requestAnimationFrame(mainLoop);
        }

        function updateWorld() {
            if (gState === 'MENU' || gState === 'INTRO' || gState === 'TRANSICAO') return;

            // Tópico 2 & 5: Mira de Precisão
            if (gState === 'MIRANDO' && currentTurn === 'PLAYER') {
                const mSpeed = 8;
                if (inputMap['KeyW'] || inputMap['ArrowUp']) reticle.y -= mSpeed;
                if (inputMap['KeyS'] || inputMap['ArrowDown']) reticle.y += mSpeed;
                if (inputMap['KeyA'] || inputMap['ArrowLeft']) reticle.x -= mSpeed;
                if (inputMap['KeyD'] || inputMap['ArrowRight']) reticle.x += mSpeed;

                // Oscilação
                const oVal = { 'normal': 1, 'hard': 3.5, 'super': 7.5 }[diffLevel];
                reticle.time += 0.055;
                reticle.x += Math.sin(reticle.time) * oVal;
                reticle.y += Math.cos(reticle.time * 0.75) * (oVal / 2);

                // Bounds
                reticle.x = Math.max(cw * 0.3, Math.min(cw * 0.7, reticle.x));
                reticle.y = Math.max(ch * 0.15, Math.min(ch * 0.48, reticle.y));

                // Tópico 6: Chute
                if (inputMap['Space']) launchChute();
            }

            // Tópico 6: Lerp Física
            if (gState === 'CHUTANDO') {
                football.t += 0.0333;
                if (football.t >= 1) {
                    football.t = 1;
                    football.active = false;
                    resolveResult();
                }
                football.x = football.startX + (football.targetX - football.startX) * football.t;
                football.y = football.startY + (football.targetY - football.startY) * football.t;

                // Tópico 21 & 22: Colisão Frame-a-Frame
                if (!football.blocked) {
                    if (football.x > arqueiro.x && football.x < arqueiro.x + arqueiro.w &&
                        football.y > arqueiro.y && football.y < arqueiro.y + arqueiro.h) {

                        football.blocked = true;
                        football.active = false;
                        createSaveBurst(football.x, football.y); // Tópico 24
                        resolveResult();
                    }
                }
            }

            // Tópico 7: IA Arqueiro
            if (currentTurn === 'PLAYER') {
                const trackSpeed = { 'normal': 0.04, 'hard': 0.18, 'super': 0.98 }[diffLevel];
                const reactDelay = { 'normal': 850, 'hard': 350, 'super': 0 }[diffLevel];

                if (diffLevel === 'super' || gState === 'CHUTANDO') {
                    arqueiro.targetX = (gState === 'CHUTANDO') ? football.x - arqueiro.w / 2 : reticle.x - arqueiro.w / 2;
                } else {
                    setTimeout(() => {
                        arqueiro.targetX = reticle.x - arqueiro.w / 2;
                    }, reactDelay);
                }
                arqueiro.x += (arqueiro.targetX - arqueiro.x) * trackSpeed;
            } else {
                // Tópico 8: Player Defende
                const moveP = 12;
                if (inputMap['KeyA'] || inputMap['ArrowLeft']) arqueiro.x -= moveP;
                if (inputMap['KeyD'] || inputMap['ArrowRight']) arqueiro.x += moveP;
            }

            arqueiro.x = Math.max(cw * 0.28, Math.min(cw * 0.72 - arqueiro.w, arqueiro.x));

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].x += particles[i].vx;
                particles[i].y += particles[i].vy;
                particles[i].life -= 2;
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
        }

        function launchChute() {
            if (gState !== 'MIRANDO') return;
            setFSM('CHUTANDO');
            football.active = true;
            football.blocked = false;
            football.t = 0;
            football.startX = football.x; football.startY = football.y;
            football.targetX = reticle.x; football.targetY = reticle.y;

            if (currentTurn === 'CPU') {
                const tx = cw * 0.33 + Math.random() * (cw * 0.34);
                const ty = ch * 0.18 + Math.random() * (ch * 0.25);
                football.targetX = tx; football.targetY = ty;
            }
        }

        function resolveResult() {
            if (isTransitioning) return; // Tópico 23/25 protection
            setFSM('RESULTADO');
            isTransitioning = true;

            const isGoalInNet = (football.x > cw * 0.28 && football.x < cw * 0.72 && football.y < ch * 0.45);

            let res = "OUT";
            if (football.blocked) {
                res = "SAVE";
            } else if (isGoalInNet) {
                res = "GOAL";
                if (currentTurn === 'PLAYER') scorePlayer++; else scoreCPU++;
            }

            showVisualFeedback(res);
            syncHUD();

            // Tópico 23: Timer de Transição Forçado (1.5s)
            setTimeout(() => {
                checkMatchStatus();
            }, 1600);
        }

        function showVisualFeedback(type) {
            const el = document.getElementById('status-msg');
            const data = { 'GOAL': { t: 'GOOOL!', c: '#0f0' }, 'SAVE': { t: 'DEFENDEU!', c: '#f00' }, 'OUT': { t: 'PARA FORA!', c: '#fff' } };

            el.innerText = data[type].t;
            el.style.color = data[type].c;
            el.style.opacity = '1';

            if (type === 'GOAL') {
                document.getElementById('flash-overlay').classList.add('flash-active');
                setTimeout(() => document.getElementById('flash-overlay').classList.remove('flash-active'), 500);
            }
        }

        function syncHUD() {
            document.getElementById('p-goals').innerText = scorePlayer;
            document.getElementById('c-goals').innerText = scoreCPU;
        }

        function checkMatchStatus() {
            // Tópico 9: Condição 3 Gols
            if (scorePlayer >= 3 || scoreCPU >= 3) {
                setFSM('TRANSICAO');
                document.getElementById('hud-main').classList.add('hidden');

                if (scorePlayer >= 3) {
                    document.getElementById('winloss-header').innerText = "VITÓRIA!";
                    const ns = TOURNEY_STAGES[stageCount + 1];
                    document.getElementById('winloss-sub').innerText = ns ? "AVANÇANDO PARA AS " + ns.toUpperCase() : "O BRASIL É SEU!";
                    document.getElementById('next-stage-btn').classList.remove('hidden');
                    document.getElementById('restart-tourney').classList.add('hidden');
                } else {
                    document.getElementById('winloss-header').innerText = "DERROTA!";
                    document.getElementById('winloss-sub').innerText = "ELIMINADO DO CAMPEONATO.";
                    document.getElementById('next-stage-btn').classList.add('hidden');
                    document.getElementById('restart-tourney').classList.remove('hidden');
                }
            } else {
                currentTurn = (currentTurn === 'PLAYER') ? 'CPU' : 'PLAYER';
                startNewTurn();
            }
        }

        function goToNextPhase() {
            stageCount++;
            if (stageCount >= TOURNEY_STAGES.length) {
                document.getElementById('champ-club').innerText = pClub.name.toUpperCase();
                setFSM('FINALE');
            } else {
                prepareIntro();
            }
        }

        function createSaveBurst(x, y) {
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15,
                    life: 100,
                    c: pClub.color
                });
            }
        }

        function drawFrame() {
            ctx.clearRect(0, 0, cw, ch);
            if (gState === 'MENU' || gState === 'INTRO') return;

            // Lines
            ctx.strokeStyle = "rgba(0, 255, 136, 0.15)";
            ctx.lineWidth = 12;
            ctx.strokeRect(cw * 0.25, ch * 0.08, cw * 0.5, ch * 0.88);

            // Goal Net (Tópico 4)
            ctx.fillStyle = "rgba(255, 255, 255, 0.05)";
            ctx.fillRect(cw * 0.28, ch * 0.14, cw * 0.44, ch * 0.12);
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 6;
            ctx.strokeRect(cw * 0.28, ch * 0.14, cw * 0.44, ch * 0.12);
            for (let x = cw * 0.28; x < cw * 0.72; x += 20) {
                ctx.beginPath(); ctx.moveTo(x, ch * 0.14); ctx.lineTo(x, ch * 0.26); ctx.stroke();
            }

            // Goleiro (Tópico 21)
            const gColor = currentTurn === 'PLAYER' ? cClub.color : pClub.color;
            ctx.fillStyle = gColor;
            ctx.shadowBlur = 25; ctx.shadowColor = gColor;
            ctx.fillRect(arqueiro.x, arqueiro.y, arqueiro.w, arqueiro.h);
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
            ctx.strokeRect(arqueiro.x, arqueiro.y, arqueiro.w, arqueiro.h);
            ctx.shadowBlur = 0;

            // Mira (Tópico 5)
            if (gState === 'MIRANDO' && currentTurn === 'PLAYER') {
                ctx.beginPath();
                ctx.arc(reticle.x, reticle.y, reticle.r, 0, Math.PI * 2);
                ctx.strokeStyle = pClub.color;
                ctx.lineWidth = 5;
                ctx.setLineDash([8, 6]);
                ctx.stroke();
                ctx.setLineDash([]);
                // Crosshair
                ctx.beginPath(); ctx.moveTo(reticle.x - 12, reticle.y); ctx.lineTo(reticle.x + 12, reticle.y); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(reticle.x, reticle.y - 12); ctx.lineTo(reticle.x, reticle.y + 12); ctx.stroke();
            }

            // Bola (Tópico 6)
            ctx.beginPath();
            ctx.arc(football.x, football.y, football.r, 0, Math.PI * 2);
            ctx.fillStyle = "#fff";
            ctx.fill();
            ctx.shadowBlur = 15; ctx.shadowColor = "#fff";
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Particles
            particles.forEach(p => {
                ctx.fillStyle = p.c;
                ctx.globalAlpha = p.life / 100;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        window.onload = setup;
    </script>
</body>

</html>
