<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRASILEIRÃO PENALTY STRIKE 2026 - V 5.0 ANTI-BUG</title>
    <style>
        :root {
            --neon-green: #00ff88;
            --pitch: #081a09;
            --hud-bg: rgba(0, 0, 0, 0.95);
            --p-color: #00ff88;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1280px;
            max-height: 720px;
            overflow: hidden;
            border: 2px solid #222;
        }

        canvas {
            display: block;
            background: var(--pitch);
            cursor: none;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.98);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .screen.active {
            display: flex;
        }

        h1 {
            font-size: 5rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 2rem;
            line-height: 0.9;
        }

        h1 span {
            color: var(--neon-green);
            text-shadow: 0 0 30px var(--neon-green);
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            width: 90%;
            max-width: 1100px;
            max-height: 400px;
            overflow-y: auto;
            background: #050505;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #333;
        }

        .team-btn {
            background: #111;
            border: 2px solid #222;
            color: #fff;
            padding: 15px;
            font-weight: 950;
            cursor: pointer;
            border-radius: 10px;
            transition: 0.25s;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .team-btn:hover {
            border-color: var(--neon-green);
            box-shadow: 0 0 15px var(--neon-green);
            transform: translateY(-4px);
        }

        .diff-row {
            margin-bottom: 2.5rem;
            display: flex;
            gap: 20px;
        }

        .diff-btn {
            background: #111;
            border: 2px solid #333;
            color: #555;
            padding: 12px 30px;
            font-weight: 900;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
        }

        .diff-btn.active {
            border-color: var(--neon-green);
            color: #fff;
            background: rgba(0, 255, 136, 0.1);
        }

        .btn-play {
            background: var(--neon-green);
            color: #000;
            border: none;
            padding: 1.5rem 5rem;
            font-size: 2.2rem;
            font-weight: 950;
            border-radius: 100px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 2rem;
            transition: 0.3s;
        }

        .btn-play:hover {
            transform: scale(1.1);
            box-shadow: 0 0 50px var(--neon-green);
        }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 60px;
            pointer-events: none;
            z-index: 50;
        }

        .hud-unit {
            background: var(--hud-bg);
            border-bottom: 5px solid var(--p-color);
            padding: 15px 40px;
            border-radius: 10px;
            font-weight: 950;
            font-size: 1.6rem;
        }

        .score-val {
            font-size: 4rem;
            font-weight: 950;
            text-shadow: 0 0 20px var(--neon-green);
        }

        .status-popup {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10rem;
            font-weight: 950;
            font-style: italic;
            z-index: 80;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 60px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            opacity: 0;
            transition: 0.1s;
        }

        .goal-flash-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 45;
        }

        .flash-trigger {
            animation: flash-play 0.5s ease-out;
        }

        @keyframes flash-play {
            0% {
                opacity: 0.9;
            }

            100% {
                opacity: 0;
            }
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--neon-green);
            border-radius: 10px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body id="body">
    <div id="container">
        <!-- Tópico 26: Kill Layer -->
        <div id="flash-fx" class="goal-flash-layer"></div>
        <canvas id="gameCanvas"></canvas>

        <div id="hud" class="hud hidden">
            <div class="hud-unit" id="lbl-p">PALMEIRAS</div>
            <div class="score-val"><span id="sc-p">0</span> : <span id="sc-c">0</span></div>
            <div class="hud-unit" id="lbl-c">CPU</div>
        </div>

        <div id="msg-box" class="status-popup">GOOOL!</div>

        <!-- Tópico 3: Seleção Elite -->
        <div id="scr-start" class="screen active">
            <h1>PENALTY <span>STRIKE 2026</span></h1>

            <div class="diff-row">
                <button class="diff-btn active" data-d="normal">NORMAL</button>
                <button class="diff-btn" data-d="hard">HARD</button>
                <button class="diff-btn" data-d="super">SUPER HARD</button>
            </div>

            <p style="margin-bottom: 20px; font-weight: 950; opacity: 0.5;">ESCOLHA SEU TIME DA SÉRIE A:</p>
            <div class="team-grid" id="team-list"></div>
        </div>

        <!-- Tópico 10: Campeonato -->
        <div id="scr-phase" class="screen">
            <p id="st-name"
                style="font-weight: 950; color: var(--neon-green); letter-spacing: 12px; margin-bottom: 10px; font-size: 1.2rem;">
                OITAVAS DE FINAL</p>
            <h1 id="match-up-lbl">TIME VS RIVAL</h1>
            <button class="btn-play" id="btn-enter">ENTRAR EM CAMPO</button>
        </div>

        <!-- Tópico 19: Resultado -->
        <div id="scr-result" class="screen">
            <h1 id="res-title">VITÓRIA!</h1>
            <p id="res-sub" style="font-size: 2rem; opacity: 0.6;">AVANÇANDO PARA A PRÓXIMA FASE</p>
            <button class="btn-play" id="btn-advance">CONTINUAR</button>
            <button class="btn-play hidden" id="btn-retry" onclick="location.reload()">TRY AGAIN</button>
        </div>

        <!-- Finale -->
        <div id="scr-finale" class="screen">
            <div style="font-size: 12rem; margin-bottom: 2rem;">🏆</div>
            <h1>REI DO <span>BRASILEIRÃO 2026</span></h1>
            <h2 id="final-club" style="font-size: 3rem; color: var(--neon-green);">TIME</h2>
            <button class="btn-play" onclick="location.reload()">MENU PRINCIPAL</button>
        </div>
    </div>

    <script>
        /**
         * BRASILEIRÃO PENALTY STRIKE 2026 - V 5.0 ANTI-BUG
         * CONSELHO DE ENGENHARIA 26 TÓPICOS
         */

        const CLUBS = [
            { n: "Palmeiras", c: "#006400" }, { n: "Flamengo", c: "#ff0000" },
            { n: "Botafogo", c: "#000000" }, { n: "Fortaleza", c: "#001e9c" },
            { n: "São Paulo", c: "#ff0000" }, { n: "Internacional", c: "#e30613" },
            { n: "Cruzeiro", c: "#003399" }, { n: "Bahia", c: "#005baa" },
            { n: "Corinthians", c: "#ffffff" }, { n: "Vasco", c: "#000000" },
            { n: "Grêmio", c: "#00aae4" }, { n: "Atlético-MG", c: "#000000" },
            { n: "Fluminense", c: "#800020" }, { n: "Athletico-PR", c: "#cc0000" },
            { n: "Vitória", c: "#ff0000" }, { n: "Bragantino", c: "#ffffff" },
            { n: "Santos", c: "#ffffff" }, { n: "Coritiba", c: "#006400" },
            { n: "Mirassol", c: "#ffff00" }, { n: "Remo", c: "#000080" }
        ];

        const STAGES = ["Oitavas de Final", "Quartas de Final", "Semifinal", "Grande Final"];

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let cw, ch;

        // Tópico 2: Input State
        const inputMap = {};
        window.onkeydown = (e) => { inputMap[e.code] = true; };
        window.onkeyup = (e) => { inputMap[e.code] = false; };

        // Tópico 25: Máquina de Estados FSM
        let gameState = 'MENU'; // MENU, PHASE, PLAYING, RESULT_ANIM, SCORE_CHECK, FINALE
        let playerTeam = null;
        let cpuTeam = null;
        let difficulty = 'normal';
        let stageIndex = 0;
        let pScore = 0;
        let cScore = 0;
        let isPlayerKicking = true;
        let transitionLocked = false;

        // Game Objects
        const ball = { x: 0, y: 0, r: 18, startX: 0, startY: 0, targetX: 0, targetY: 0, t: 0, active: false, blocked: false };
        const reticle = { x: 0, y: 0, r: 35, time: 0 };
        const goalie = { x: 0, y: 0, w: 125, h: 55, targetX: 0 };
        const parts = []; // Partículas Tópico 24

        function init() {
            onResize();
            window.addEventListener('resize', onResize);

            // Build UI
            const grid = document.getElementById('team-list');
            CLUBS.forEach(club => {
                const btn = document.createElement('button');
                btn.className = 'team-btn';
                btn.innerText = club.n;
                btn.onclick = () => selectClub(club);
                grid.appendChild(btn);
            });

            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    difficulty = btn.dataset.d;
                };
            });

            document.getElementById('btn-enter').onclick = startFullMatch;
            document.getElementById('btn-advance').onclick = nextStage;

            // Tópico 1: Boot Engine
            engineLoop();
        }

        function onResize() {
            cw = canvas.width = window.innerWidth;
            ch = canvas.height = window.innerHeight;
            if (ch > 720) ch = canvas.height = 720;
            if (cw > 1280) cw = canvas.width = 1280;
        }

        function selectClub(club) {
            playerTeam = club;
            document.documentElement.style.setProperty('--p-color', club.c);

            cpuTeam = CLUBS[Math.floor(Math.random() * CLUBS.length)];
            while (cpuTeam.n === playerTeam.n) cpuTeam = CLUBS[Math.floor(Math.random() * CLUBS.length)];

            document.getElementById('st-name').innerText = STAGES[stageIndex].toUpperCase();
            document.getElementById('match-up-lbl').innerText = `${playerTeam.n.toUpperCase()} VS ${cpuTeam.n.toUpperCase()}`;
            setScreen('scr-phase');
        }

        function setScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            if (id !== 'none') document.getElementById(id).classList.add('active');

            if (id === 'scr-start') gameState = 'MENU';
            else if (id === 'scr-phase') gameState = 'PHASE';
            else if (id === 'none') {
                gameState = 'PLAYING';
                canvas.focus(); // Tópico 20
                document.getElementById('hud').classList.remove('hidden');
            }
        }

        function startFullMatch() {
            pScore = 0; cScore = 0; // Tópico 11 Critical Reset
            updateHUD();
            startNewRound();
        }

        function startNewRound() {
            transitionLocked = false;
            // Tópico 26: Kill Ball Switch
            ball.active = false;
            ball.blocked = false;
            ball.t = 0;
            ball.x = cw / 2;
            ball.y = ch * 0.9;
            ball.startX = ball.x;
            ball.startY = ball.y;

            reticle.x = cw / 2;
            reticle.y = ch * 0.35;

            goalie.x = cw / 2 - goalie.w / 2;
            goalie.y = ch * 0.22;
            goalie.targetX = goalie.x;

            document.getElementById('msg-box').style.opacity = '0';
            setScreen('none');

            if (!isPlayerKicking) {
                setTimeout(triggerChute, 1500);
            }
        }

        function engineLoop() {
            // Tópico 25: switch(gameState)
            switch (gameState) {
                case 'PLAYING':
                    updateLogic();
                    break;
            }
            renderVis();
            requestAnimationFrame(engineLoop);
        }

        function updateLogic() {
            // Tópico 2 & 5: Mira Logic
            if (!ball.active && isPlayerKicking) {
                const moveS = 8;
                if (inputMap['KeyW'] || inputMap['ArrowUp']) reticle.y -= moveS;
                if (inputMap['KeyS'] || inputMap['ArrowDown']) reticle.y += moveS;
                if (inputMap['KeyA'] || inputMap['ArrowLeft']) reticle.x -= moveS;
                if (inputMap['KeyD'] || inputMap['ArrowRight']) reticle.x += moveS;

                // Drift Dificuldade
                const drift = { 'normal': 1, 'hard': 3.5, 'super': 8 }[difficulty];
                reticle.time += 0.055;
                reticle.x += Math.sin(reticle.time) * drift;
                reticle.y += Math.cos(reticle.time * 0.8) * (drift / 2);

                reticle.x = Math.max(cw * 0.3, Math.min(cw * 0.7, reticle.x));
                reticle.y = Math.max(ch * 0.1, Math.min(ch * 0.48, reticle.y));

                // Tópico 6: Chute trigger
                if (inputMap['Space']) triggerChute();
            }

            // Tópico 6: Lerp Trajectory
            if (ball.active) {
                ball.t += 0.0333; // ~0.5s total
                if (ball.t >= 1) {
                    ball.t = 1;
                    ball.active = false;
                    concludeShot();
                }
                ball.x = ball.startX + (ball.targetX - ball.startX) * ball.t;
                ball.y = ball.startY + (ball.targetY - ball.startY) * ball.t;

                // Tópico 21, 22 & 26: Frame Collision & Kill Switch
                if (!ball.blocked) {
                    if (ball.x > goalie.x && ball.x < goalie.x + goalie.w &&
                        ball.y > goalie.y && ball.y < goalie.y + goalie.h) {

                        // Tópico 26: ANTI-BUG KILL SWITCH
                        ball.blocked = true;
                        ball.active = false;
                        ball.x = -100; ball.y = -100; // Teleport away safely
                        spawnSaveBurst(goalie.x + goalie.w / 2, goalie.y + goalie.h / 2);
                        concludeShot();
                    }
                }
            }

            // Tópico 7: Goleiro IA
            if (isPlayerKicking) {
                const spdIdx = { 'normal': 0.035, 'hard': 0.18, 'super': 0.99 }[difficulty];
                const delayIdx = { 'normal': 800, 'hard': 300, 'super': 0 }[difficulty];

                if (difficulty === 'super' || ball.active) {
                    goalie.targetX = (ball.active) ? ball.x - goalie.w / 2 : reticle.x - goalie.w / 2;
                } else {
                    setTimeout(() => { goalie.targetX = reticle.x - goalie.w / 2; }, delayIdx);
                }
                goalie.x += (goalie.targetX - goalie.x) * spdIdx;
            } else {
                // Tópico 2: Jogador Goleiro
                const speedG = 12;
                if (inputMap['KeyA'] || inputMap['ArrowLeft']) goalie.x -= speedG;
                if (inputMap['KeyD'] || inputMap['ArrowRight']) goalie.x += speedG;
            }
            goalie.x = Math.max(cw * 0.28, Math.min(cw * 0.72 - goalie.w, goalie.x));

            // Particles
            for (let i = parts.length - 1; i >= 0; i--) {
                parts[i].x += parts[i].vx;
                parts[i].y += parts[i].vy;
                parts[i].life -= 2;
                if (parts[i].life <= 0) parts.splice(i, 1);
            }
        }

        function triggerChute() {
            if (ball.active) return;
            ball.active = true;
            ball.blocked = false;
            ball.t = 0;
            ball.startX = ball.x; ball.startY = ball.y;
            ball.targetX = reticle.x; ball.targetY = reticle.y;

            if (!isPlayerKicking) {
                // Inteligência Batedor CPU
                const tx = cw * 0.35 + Math.random() * (cw * 0.3);
                const ty = ch * 0.15 + Math.random() * (ch * 0.3);
                ball.targetX = tx; ball.targetY = ty;
            }
        }

        function concludeShot() {
            if (transitionLocked) return;
            transitionLocked = true;
            gameState = 'RESULT_ANIM';

            const inGoal = (!ball.blocked && ball.x > cw * 0.31 && ball.x < cw * 0.69 && ball.y < ch * 0.45);

            let res = "OUT";
            if (ball.blocked) res = "SAVE";
            else if (inGoal) {
                res = "GOAL";
                if (isPlayerKicking) pScore++; else cScore++;
            }

            flashResult(res);
            updateHUD();

            // Tópico 23: Forced Safety Transition (1.6s)
            setTimeout(() => {
                logicTransition();
            }, 1600);
        }

        function logicTransition() {
            // Tópico 9: Sudden Death 3 Gols
            if (pScore >= 3 || cScore >= 3) {
                gameState = 'PHASE_END';
                document.getElementById('hud').classList.add('hidden');
                setScreen('scr-result');

                if (pScore >= 3) {
                    document.getElementById('res-title').innerText = "VITÓRIA!";
                    const ns = STAGES[stageIndex + 1];
                    document.getElementById('res-sub').innerText = ns ? "SUBINDO PARA: " + ns.toUpperCase() : "CAMPEÃO NACIONAL!";
                    document.getElementById('btn-advance').classList.remove('hidden');
                    document.getElementById('btn-retry').classList.add('hidden');
                } else {
                    document.getElementById('res-title').innerText = "DERROTA!";
                    document.getElementById('res-sub').innerText = "ELIMINADO DA SÉRIE A 2026";
                    document.getElementById('btn-advance').classList.add('hidden');
                    document.getElementById('btn-retry').classList.remove('hidden');
                }
            } else {
                isPlayerKicking = !isPlayerKicking;
                startNewRound();
            }
        }

        function flashResult(type) {
            const el = document.getElementById('msg-box');
            const map = { 'GOAL': { t: 'GOOOL!', c: '#0f0' }, 'SAVE': { t: 'DEFENDEU!', c: '#f00' }, 'OUT': { t: 'PARA FORA!', c: '#fff' } };

            el.innerText = map[type].t;
            el.style.color = map[type].c;
            el.style.opacity = '1';

            if (type === 'GOAL') {
                document.getElementById('flash-fx').classList.add('flash-trigger');
                setTimeout(() => document.getElementById('flash-fx').classList.remove('flash-trigger'), 500);
            }
        }

        function updateHUD() {
            document.getElementById('sc-p').innerText = pScore;
            document.getElementById('sc-c').innerText = cScore;
            document.getElementById('lbl-p').innerText = playerTeam ? playerTeam.n.substring(0, 3).toUpperCase() : "PLY";
            document.getElementById('lbl-c').innerText = cpuTeam ? cpuTeam.n.substring(0, 3).toUpperCase() : "CPU";
        }

        function nextStage() {
            stageIndex++;
            if (stageIndex >= STAGES.length) {
                document.getElementById('final-club').innerText = playerTeam.n.toUpperCase();
                setScreen('scr-finale');
                gameState = 'FINALE';
            } else {
                selectClub(playerTeam);
            }
        }

        function spawnSaveBurst(x, y) {
            for (let i = 0; i < 20; i++) {
                parts.push({ x, y, vx: (Math.random() - 0.5) * 18, vy: (Math.random() - 0.5) * 18, life: 100, color: playerTeam.c });
            }
        }

        function renderVis() {
            ctx.clearRect(0, 0, cw, ch);
            if (gameState === 'MENU' || gameState === 'PHASE') return;

            // Pitch Borders
            ctx.strokeStyle = "rgba(0, 255, 136, 0.15)";
            ctx.lineWidth = 10;
            ctx.strokeRect(cw * 0.28, ch * 0.1, cw * 0.44, ch * 0.88);

            // Tópico 4: Goal Net
            ctx.fillStyle = "rgba(255,255,255,0.06)";
            ctx.fillRect(cw * 0.3, ch * 0.14, cw * 0.4, ch * 0.12);
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 5;
            ctx.strokeRect(cw * 0.3, ch * 0.14, cw * 0.4, ch * 0.12);

            // Keeper (Tópico 21)
            const kc = isPlayerKicking ? cpuTeam.c : playerTeam.c;
            ctx.fillStyle = kc;
            ctx.shadowBlur = 25; ctx.shadowColor = kc;
            ctx.fillRect(goalie.x, goalie.y, goalie.w, goalie.h);
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
            ctx.strokeRect(goalie.x, goalie.y, goalie.w, goalie.h);
            ctx.shadowBlur = 0;

            // Mira (Tópico 5)
            if (!ball.active && isPlayerKicking) {
                ctx.beginPath();
                ctx.arc(reticle.x, reticle.y, reticle.r, 0, Math.PI * 2);
                ctx.strokeStyle = playerTeam.c; ctx.lineWidth = 5; ctx.setLineDash([8, 4]);
                ctx.stroke(); ctx.setLineDash([]);
                ctx.beginPath(); ctx.moveTo(reticle.x - 10, reticle.y); ctx.lineTo(reticle.x + 10, reticle.y); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(reticle.x, reticle.y - 10); ctx.lineTo(reticle.x, reticle.y + 10); ctx.stroke();
            }

            // Ball (Tópico 6)
            if (ball.active || gameState === 'PLAYING') {
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
                ctx.fillStyle = "#fff"; ctx.fill();
                ctx.shadowBlur = 15; ctx.shadowColor = "#fff"; ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // Particles
            parts.forEach(p => {
                ctx.fillStyle = p.color; ctx.globalAlpha = p.life / 100;
                ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        window.onload = init;
    </script>
</body>

</html>
