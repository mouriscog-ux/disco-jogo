<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRASILEIRÃO PENALTY STRIKE 2026 - V 5.0 ANTI-BUG</title>
    <style>
        :root {
            --neon: #00ff88;
            --pitch: #0a1f0c;
            --hud: rgba(0, 0, 0, 0.9);
            --txt: #fff;
            --p-color: #00ff88;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Impact, sans-serif;
        }

        body {
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1280px;
            max-height: 720px;
            outline: 5px solid #111;
            overflow: hidden;
        }

        canvas {
            display: block;
            background: var(--pitch);
            cursor: none;
        }

        /* UI Screens */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.98);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }

        .overlay.active {
            display: flex;
        }

        h1 {
            font-size: 5rem;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 2rem;
        }

        h1 span {
            color: var(--neon);
            text-shadow: 0 0 40px var(--neon);
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 90%;
            max-width: 1000px;
            max-height: 400px;
            overflow-y: auto;
            background: #080808;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .team-btn {
            background: #111;
            border: 2px solid #222;
            color: #fff;
            padding: 15px;
            font-weight: 900;
            cursor: pointer;
            border-radius: 8px;
            text-transform: uppercase;
            font-size: 0.75rem;
            transition: 0.2s;
        }

        .team-btn:hover {
            border-color: var(--neon);
            transform: translateY(-4px);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.2);
        }

        .diff-row {
            margin-bottom: 3rem;
            display: flex;
            gap: 20px;
        }

        .diff-btn {
            background: #111;
            border: 2.5px solid #222;
            color: #666;
            padding: 12px 30px;
            font-weight: 950;
            cursor: pointer;
            border-radius: 6px;
        }

        .diff-btn.active {
            border-color: var(--neon);
            color: #fff;
            background: rgba(0, 255, 136, 0.1);
        }

        .action-btn {
            background: var(--neon);
            color: #000;
            border: none;
            padding: 1.5rem 5rem;
            font-size: 2.5rem;
            font-weight: 950;
            border-radius: 80px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 30px;
            transition: 0.3s;
        }

        .action-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 60px var(--neon);
        }

        /* HUD */
        .match-hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 90px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 60px;
            pointer-events: none;
            z-index: 50;
        }

        .club-label {
            background: var(--hud);
            border-bottom: 5px solid var(--p-color);
            padding: 12px 35px;
            border-radius: 6px;
            font-weight: 950;
            font-size: 1.4rem;
        }

        .match-score {
            font-size: 4rem;
            font-weight: 950;
            letter-spacing: 5px;
            text-shadow: 0 0 20px var(--neon);
        }

        .flash-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 45;
        }

        .flash-fx {
            animation: flash-play 0.4s ease-out;
        }

        @keyframes flash-play {
            0% {
                opacity: 0.8;
            }

            100% {
                opacity: 0;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--neon);
            border-radius: 10px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body id="body">
    <div id="viewport">
        <!-- Tópico 26: Kill Layer Visuals -->
        <div id="flash-overlay" class="flash-layer"></div>
        <canvas id="gameCanvas"></canvas>

        <!-- Tópico 16: HUD -->
        <div id="hud" class="match-hud hidden">
            <div class="club-label" id="hud-p">PALMEIRAS</div>
            <div class="match-score"><span id="score-p">0</span> : <span id="score-c">0</span></div>
            <div class="club-label" id="hud-c">CPU</div>
        </div>

        <!-- Tópico 3: Menu Initial -->
        <div id="menu-screen" class="overlay active">
            <h1>STRIKE <span>BRASILEIRÃO 2026</span></h1>

            <div class="diff-row">
                <button class="diff-btn active" data-diff="normal">NORMAL</button>
                <button class="diff-btn" data-diff="hard">HARD</button>
                <button class="diff-btn" data-diff="super">SUPER HARD</button>
            </div>

            <p style="margin-bottom: 15px; font-weight: 950; opacity: 0.4; font-size: 0.9rem;">ESCOLHA SEU TIME DA SÉRIE
                A:</p>
            <div class="team-grid" id="team-grid"></div>
        </div>

        <!-- Tópico 10: State Intro Tournament -->
        <div id="stage-screen" class="overlay">
            <p id="stage-name"
                style="font-weight: 950; color: var(--neon); letter-spacing: 12px; margin-bottom: 0.5rem; font-size: 1.2rem;">
                OITAVAS DE FINAL</p>
            <h1 id="match-up-text">PALMEIRAS VS FLAMENGO</h1>
            <button class="action-btn" id="start-btn">ENTRAR EM CAMPO</button>
        </div>

        <!-- Tópico 19: Screen Result -->
        <div id="match-screen" class="overlay">
            <h1 id="result-title">VITÓRIA!</h1>
            <p id="result-sub" style="font-size: 1.8rem; opacity: 0.5;">CLASSIFICADO PARA AS QUARTAS</p>
            <button class="action-btn" id="next-btn">PRÓXIMA FASE</button>
            <button class="action-btn hidden" id="retry-btn" onclick="location.reload()">TENTAR NOVAMENTE</button>
        </div>

        <!-- Finale -->
        <div id="finale-screen" class="overlay">
            <div style="font-size: 10rem; margin-bottom: 1rem;">🏆</div>
            <h1>CAMPEÃO <span>DO BRASIL 2026</span></h1>
            <h2 id="final-team-name" style="font-size: 2.5rem; color: var(--neon);">PALMEIRAS</h2>
            <button class="action-btn" onclick="location.reload()">FINALIZAR</button>
        </div>
    </div>

    <script>
        /**
         * BRASILEIRÃO PENALTY STRIKE 2026 - V 5.0 ANTI-BUG
         * PROTOCOLO DE ENGENHARIA 30 PONTOS
         */

        const CLUBS = [
            { n: "Palmeiras", c: "#006400" }, { n: "Flamengo", c: "#ff0000" },
            { n: "Botafogo", c: "#000000" }, { n: "Fortaleza", c: "#001e9c" },
            { n: "São Paulo", c: "#ff0000" }, { n: "Internacional", c: "#e30613" },
            { n: "Cruzeiro", c: "#003399" }, { n: "Bahia", c: "#005baa" },
            { n: "Corinthians", c: "#ffffff" }, { n: "Vasco", c: "#000000" },
            { n: "Grêmio", c: "#00aae4" }, { n: "Atlético-MG", c: "#000000" },
            { n: "Fluminense", c: "#800020" }, { n: "Athletico-PR", c: "#cc0000" },
            { n: "Vitória", c: "#ff0000" }, { n: "Bragantino", c: "#ffffff" },
            { n: "Santos", c: "#ffffff" }, { n: "Coritiba", c: "#006400" },
            { n: "Mirassol", c: "#ffff00" }, { n: "Remo", c: "#000080" }
        ];

        const STAGES = ["Oitavas de Final", "Quartas de Final", "Semifinal", "Grande Final"];

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let cw, ch;

        // Tópico 2: Input State
        const keys = {};
        window.onkeydown = (e) => { keys[e.code] = true; };
        window.onkeyup = (e) => { keys[e.code] = false; };

        // Tópico 25 & 29: Máquina de Estados (Switch Case)
        // MENU, INTRO, PREPARING, STRIKING, CELEBRATING, TRANSITIONING
        let gameState = 'MENU';
        let playerClub = null;
        let cpuClub = null;
        let pGoals = 0;
        let cGoals = 0;
        let tourStageIdx = 0;
        let difficulty = 'normal';
        let isPlayerStriker = true;
        let feedbackText = "";
        let feedbackColor = "#fff";
        let celebrationTimer = 0;

        // Objects
        const ball = { x: 0, y: 0, r: 18, sX: 0, sY: 0, tX: 0, tY: 0, t: 0, active: false, blocked: false };
        const aim = { x: 0, y: 0, r: 35, time: 0 };
        const keeper = { x: 0, y: 0, w: 125, h: 55, tx: 0 };
        const particles = [];

        function init() {
            onResize();
            window.addEventListener('resize', onResize);

            // Build Club Menu
            const grid = document.getElementById('team-grid');
            CLUBS.forEach(team => {
                const b = document.createElement('button');
                b.className = 'team-btn';
                b.innerText = team.n;
                b.onclick = () => selectPlayerClub(team);
                grid.appendChild(b);
            });

            document.querySelectorAll('.diff-btn').forEach(b => {
                b.onclick = () => {
                    document.querySelectorAll('.diff-btn').forEach(x => x.classList.remove('active'));
                    b.classList.add('active');
                    difficulty = b.dataset.diff;
                };
            });

            document.getElementById('start-btn').onclick = startFullMatch;
            document.getElementById('next-btn').onclick = advanceTournament;

            // Tópico 1: Engine Start
            loop();
        }

        function onResize() {
            cw = canvas.width = window.innerWidth;
            ch = canvas.height = window.innerHeight;
            if (ch > 720) ch = canvas.height = 720;
            if (cw > 1280) cw = canvas.width = 1280;
        }

        function selectPlayerClub(team) {
            playerClub = team;
            document.documentElement.style.setProperty('--p-color', team.c);

            // Random Rival
            cpuClub = CLUBS[Math.floor(Math.random() * CLUBS.length)];
            while (cpuClub.n === playerClub.n) cpuClub = CLUBS[Math.floor(Math.random() * CLUBS.length)];

            document.getElementById('stage-name').innerText = STAGES[tourStageIdx].toUpperCase();
            document.getElementById('match-up-text').innerText = `${playerClub.n.toUpperCase()} VS ${cpuClub.n.toUpperCase()}`;
            setScreen('stage-screen');
        }

        function setScreen(id) {
            document.querySelectorAll('.overlay').forEach(s => s.classList.remove('active'));
            if (id !== 'none') document.getElementById(id).classList.add('active');

            if (id === 'menu-screen') gameState = 'MENU';
            else if (id === 'stage-screen') gameState = 'INTRO';
            else if (id === 'none') {
                gameState = 'PREPARING';
                canvas.focus(); // Tópico 20
                document.getElementById('hud').classList.remove('hidden');
            } else gameState = 'TRANSITIONING';
        }

        function startFullMatch() {
            pGoals = 0; cGoals = 0; // Tópico 11: Score Reset
            updateHUD();
            setScreen('none');
            resetFieldPositions();
        }

        function resetFieldPositions() {
            gameState = 'PREPARING';
            ball.active = false;
            ball.blocked = false;
            ball.t = 0;
            ball.x = cw / 2;
            ball.y = ch * 0.9;
            ball.sX = ball.x; ball.sY = ball.y;

            aim.x = cw / 2;
            aim.y = ch * 0.35;

            keeper.x = cw / 2 - keeper.w / 2;
            keeper.y = ch * 0.22;
            keeper.tx = keeper.x;

            feedbackText = "";
            celebrationTimer = 0;

            if (!isPlayerStriker) {
                setTimeout(triggerChute, 1500);
            }
        }

        function loop() {
            update();
            render();
            requestAnimationFrame(loop);
        }

        function update() {
            // Tópico 29: Switch Case FSM
            switch (gameState) {
                case 'PREPARING':
                    updateInputAim();
                    break;
                case 'STRIKING':
                    updatePhysics();
                    break;
                case 'CELEBRATING':
                    updateCelebration();
                    break;
            }

            // Always update Keeper & Particles
            updateKeeper();
            updateParticles();
        }

        function updateInputAim() {
            if (!isPlayerStriker) return;

            const speed = 8.5;
            if (keys['KeyW'] || keys['ArrowUp']) aim.y -= speed;
            if (keys['KeyS'] || keys['ArrowDown']) aim.y += speed;
            if (keys['KeyA'] || keys['ArrowLeft']) aim.x -= speed;
            if (keys['KeyD'] || keys['ArrowRight']) aim.x += speed;

            // Tópico 5: Oscillation
            const drift = { 'normal': 1, 'hard': 3.8, 'super': 8.5 }[difficulty];
            aim.time += 0.055;
            aim.x += Math.sin(aim.time) * drift;
            aim.y += Math.cos(aim.time * 0.8) * (drift / 2);

            // Constraints
            aim.x = Math.max(cw * 0.3, Math.min(cw * 0.7, aim.x));
            aim.y = Math.max(ch * 0.12, Math.min(ch * 0.48, aim.y));

            if (keys['Space']) triggerChute();
        }

        function triggerChute() {
            if (gameState !== 'PREPARING') return;
            gameState = 'STRIKING';
            ball.active = true;
            ball.blocked = false;
            ball.t = 0;
            ball.sX = ball.x; ball.sY = ball.y;
            ball.tX = aim.x; ball.tY = aim.y;

            if (!isPlayerStriker) {
                // Topic 14/8: IA decides target
                ball.tX = cw * 0.34 + Math.random() * (cw * 0.32);
                ball.tY = ch * 0.15 + Math.random() * (ch * 0.3);
            }
        }

        function updatePhysics() {
            // Tópico 6: Lerp
            ball.t += 0.033; // 1/30 for 1s? No, 0.5s targets 60fps ~ 0.033 is good for ~30 steps.
            if (ball.t >= 1) {
                ball.t = 1;
                handleEndOfShot();
            }
            ball.x = ball.sX + (ball.tX - ball.sX) * ball.t;
            ball.y = ball.sY + (ball.tY - ball.sY) * ball.t;

            // Tópico 21 & 22: Frame-by-Frame Collision
            if (!ball.blocked) {
                if (ball.x > keeper.x && ball.x < keeper.x + keeper.w &&
                    ball.y > keeper.y && ball.y < keeper.y + keeper.h) {

                    ball.blocked = true;
                    // Tópico 26: KILL SWITCH
                    killBall();
                    handleShotResult("SAVE");
                }
            }
        }

        function killBall() {
            ball.active = false;
            ball.x = -100; ball.y = -100;
        }

        function handleShotResult(type) {
            if (gameState === 'CELEBRATING') return;
            gameState = 'CELEBRATING';
            celebrationTimer = 90; // 90 frames = 1.5s

            if (type === 'SAVE') {
                feedbackText = "DEFENDEU!";
                feedbackColor = "#ff2222";
                spawnBurstEffect(keeper.x + keeper.w / 2, keeper.y + keeper.h / 2);
            } else if (type === "GOAL") {
                feedbackText = "GOOOL!";
                feedbackColor = "#00ff88";
                if (isPlayerStriker) pGoals++; else cGoals++;
                updateHUD();
                triggerFlash();
            } else {
                feedbackText = "PARA FORA!";
                feedbackColor = "#ffffff";
            }

            // Tópico 23: Mandatory Transition Timer (Back-end logic continues)
            // No alert() or blocking.
        }

        function handleEndOfShot() {
            if (ball.blocked) return;
            const inGoal = (ball.x > cw * 0.3 && ball.x < cw * 0.7 && ball.y < ch * 0.45);
            handleShotResult(inGoal ? "GOAL" : "OUT");
            killBall();
        }

        function updateCelebration() {
            celebrationTimer--;
            if (celebrationTimer <= 0) {
                // Tópico 28 & 30: nextPlay() Cleaning
                checkMatchWinWin();
            }
        }

        function updateKeeper() {
            if (gameState === 'MENU' || gameState === 'INTRO') return;

            if (isPlayerStriker) {
                // Tópico 7: IA Keeper
                const speed = { 'normal': 0.04, 'hard': 0.18, 'super': 0.99 }[difficulty];
                const delay = { 'normal': 800, 'hard': 350, 'super': 0 }[difficulty];

                if (difficulty === 'super' || gameState === 'STRIKING') {
                    keeper.tx = (gameState === 'STRIKING') ? (ball.x - keeper.w / 2) : (aim.x - keeper.w / 2);
                } else {
                    setTimeout(() => { keeper.tx = aim.x - keeper.w / 2; }, delay);
                }
                keeper.x += (keeper.tx - keeper.x) * speed;
            } else {
                // Tópico 8: Player Keeper
                const pSpeed = 13.5;
                if (keys['KeyA'] || keys['ArrowLeft']) keeper.x -= pSpeed;
                if (keys['KeyD'] || keys['ArrowRight']) keeper.x += pSpeed;
            }

            keeper.x = Math.max(cw * 0.29, Math.min(cw * 0.71 - keeper.w, keeper.x));
        }

        function checkMatchWinWin() {
            // Tópico 9: Sudden Death 3 Gols
            if (pGoals >= 3 || cGoals >= 3) {
                gameState = 'TRANSITIONING';
                document.getElementById('hud').classList.add('hidden');
                setScreen('match-screen');

                if (pGoals >= 3) {
                    document.getElementById('result-title').innerText = "VITÓRIA!";
                    const next = STAGES[tourStageIdx + 1];
                    document.getElementById('result-sub').innerText = next ? "RUMO ÀS " + next.toUpperCase() : "O CAMPEÃO BRASILEIRO!";
                    document.getElementById('next-btn').classList.remove('hidden');
                    document.getElementById('retry-btn').classList.add('hidden');
                } else {
                    document.getElementById('result-title').innerText = "DERROTA!";
                    document.getElementById('result-sub').innerText = "ELIMINADO DO TORNEIO.";
                    document.getElementById('next-btn').classList.add('hidden');
                    document.getElementById('retry-btn').classList.remove('hidden');
                }
            } else {
                isPlayerStriker = !isPlayerStriker;
                resetFieldPositions();
            }
        }

        function advanceTournament() {
            tourStageIdx++;
            if (tourStageIdx >= STAGES.length) {
                document.getElementById('final-team-name').innerText = playerClub.n.toUpperCase();
                setScreen('finale-screen');
            } else {
                selectPlayerClub(playerClub);
            }
        }

        function updateHUD() {
            document.getElementById('score-p').innerText = pGoals;
            document.getElementById('score-c').innerText = cGoals;
            document.getElementById('hud-p').innerText = playerClub ? playerClub.n.substring(0, 3).toUpperCase() : "PLR";
            document.getElementById('hud-c').innerText = cpuClub ? cpuClub.n.substring(0, 3).toUpperCase() : "CPU";
        }

        function triggerFlash() {
            const f = document.getElementById('flash-overlay');
            f.classList.add('flash-fx');
            setTimeout(() => f.classList.remove('flash-fx'), 400);
        }

        function spawnBurstEffect(x, y) {
            for (let i = 0; i < 18; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 18,
                    vy: (Math.random() - 0.5) * 18,
                    l: 100,
                    c: isPlayerStriker ? cpuClub.c : playerClub.c
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.l -= 2.5;
                if (p.l <= 0) particles.splice(i, 1);
            }
        }

        // Tópico 27: Mensagens Voláteis (ctx.fillText)
        function render() {
            ctx.clearRect(0, 0, cw, ch);
            if (gameState === 'MENU' || gameState === 'INTRO') return;

            // Pitch Borders
            ctx.strokeStyle = "rgba(0, 255, 136, 0.1)";
            ctx.lineWidth = 10;
            ctx.strokeRect(cw * 0.27, ch * 0.08, cw * 0.46, ch * 0.89);

            // Goal Net (Tópico 4)
            ctx.fillStyle = "rgba(255, 255, 255, 0.04)";
            ctx.fillRect(cw * 0.3, ch * 0.14, cw * 0.4, ch * 0.12);
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 5;
            ctx.strokeRect(cw * 0.3, ch * 0.14, cw * 0.4, ch * 0.12);
            for (let gx = cw * 0.3; gx < cw * 0.7; gx += 25) {
                ctx.beginPath(); ctx.moveTo(gx, ch * 0.14); ctx.lineTo(gx, ch * 0.26); ctx.stroke();
            }

            // Keeper (Tópico 21)
            const kColor = isPlayerStriker ? cpuClub.c : playerClub.c;
            ctx.fillStyle = kColor;
            ctx.shadowBlur = 25; ctx.shadowColor = kColor;
            ctx.fillRect(keeper.x, keeper.y, keeper.w, keeper.h);
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
            ctx.strokeRect(keeper.x, keeper.y, keeper.w, keeper.h);
            ctx.shadowBlur = 0;

            // Aim (Tópico 5)
            if (gameState === 'PREPARING' && isPlayerStriker) {
                ctx.beginPath();
                ctx.arc(aim.x, aim.y, aim.r, 0, Math.PI * 2);
                ctx.strokeStyle = playerClub.c;
                ctx.lineWidth = 4;
                ctx.setLineDash([10, 5]);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.beginPath();
                ctx.moveTo(aim.x - 10, aim.y); ctx.lineTo(aim.x + 10, aim.y);
                ctx.moveTo(aim.x, aim.y - 10); ctx.lineTo(aim.x, aim.y + 10);
                ctx.stroke();
            }

            // Ball (Tópico 6)
            if (ball.active || gameState === 'PREPARING') {
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
                ctx.fillStyle = "#fff";
                ctx.fill();
                ctx.shadowBlur = 10; ctx.shadowColor = "#fff"; ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // Result Text Overlay (Tópico 27)
            if (gameState === 'CELEBRATING') {
                ctx.font = "italic 900 100px 'Segoe UI'";
                ctx.textAlign = "center";
                ctx.fillStyle = feedbackColor;
                ctx.lineWidth = 10; ctx.strokeStyle = "rgba(0,0,0,0.5)";
                ctx.strokeText(feedbackText, cw / 2, ch / 2);
                ctx.fillText(feedbackText, cw / 2, ch / 2);
            }

            // Particles
            particles.forEach(p => {
                ctx.fillStyle = p.c; ctx.globalAlpha = p.l / 100;
                ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        window.onload = init;
    </script>
</body>

</html>
