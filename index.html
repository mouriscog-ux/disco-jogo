<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRASILEIRÃO PENALTY STRIKE 2026 - FINAL V2.1</title>
    <style>
        :root {
            --neon-primary: #00ff88;
            --pitch-color: #0b220c;
            --hud-bg: rgba(0, 0, 0, 0.9);
            --team-color: #00ff88;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1280px;
            max-height: 720px;
            overflow: hidden;
            border: 2px solid #222;
        }

        canvas {
            background: var(--pitch-color);
            display: block;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.96);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }

        .screen.active {
            display: flex;
        }

        h1 {
            font-size: 4rem;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        h1 span {
            color: var(--neon-primary);
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 1000px;
            max-height: 450px;
            overflow-y: auto;
            background: #111;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #333;
        }

        .team-btn {
            background: #1a1a1a;
            border: 2px solid #222;
            color: #fff;
            padding: 18px;
            font-weight: 900;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        .team-btn:hover {
            border-color: var(--neon-primary);
            background: #222;
            transform: translateY(-3px);
        }

        .difficulty-row {
            margin-bottom: 2.5rem;
            display: flex;
            gap: 15px;
        }

        .diff-btn {
            background: #222;
            border: 2px solid #333;
            color: #fff;
            padding: 12px 25px;
            font-weight: 800;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }

        .diff-btn.active {
            border-color: var(--neon-primary);
            background: rgba(0, 255, 136, 0.1);
        }

        .action-button {
            background: var(--neon-primary);
            color: #000;
            border: none;
            padding: 1.5rem 5rem;
            font-size: 1.8rem;
            font-weight: 950;
            border-radius: 100px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 2rem;
            transition: 0.3s;
        }

        .action-button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 50px var(--neon-primary);
        }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px;
            pointer-events: none;
            z-index: 50;
        }

        .hud-side {
            background: var(--hud-bg);
            border-bottom: 4px solid var(--team-color);
            padding: 12px 35px;
            border-radius: 5px;
            font-weight: 900;
            font-size: 1.4rem;
        }

        .hud-score {
            font-size: 3.5rem;
            font-weight: 950;
            color: #fff;
            text-shadow: 0 0 20px var(--neon-primary);
        }

        .feedback-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem;
            font-weight: 900;
            font-style: italic;
            z-index: 60;
            text-transform: uppercase;
            pointer-events: none;
            opacity: 0;
            transition: 0.2s;
        }

        .goal-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 40;
        }

        .flash-anim {
            animation: flash-fade 0.4s ease-out;
        }

        @keyframes flash-fade {
            0% {
                opacity: 0.8;
            }

            100% {
                opacity: 0;
            }
        }

        .hidden {
            display: none !important;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--neon-primary);
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div id="game-container">
        <!-- Tópico 4: Arena Visual -->
        <div id="goal-flash" class="goal-flash"></div>
        <canvas id="gameCanvas"></canvas>

        <!-- Tópico 16: UI HUD -->
        <div id="hud" class="hud hidden">
            <div class="hud-side" id="p-label">PALMEIRAS</div>
            <div class="hud-score"><span id="pscore">0</span> : <span id="cscore">0</span></div>
            <div class="hud-side" id="c-label">CPU</div>
        </div>

        <div id="feedback" class="feedback-overlay">GOOOL!</div>

        <!-- Tópico 3: Menu de Clubes -->
        <div id="screen-menu" class="screen active">
            <h1>PENALTY <span>STRIKE 2026</span></h1>

            <div class="difficulty-row">
                <button class="diff-btn active" data-diff="normal">NORMAL</button>
                <button class="diff-btn" data-diff="hard">HARD</button>
                <button class="diff-btn" data-diff="super">SUPER HARD</button>
            </div>

            <p style="margin-bottom: 15px; font-weight: 800; opacity: 0.7;">ESCOLHA SEU ESCUDO:</p>
            <div class="team-grid" id="team-grid"></div>
        </div>

        <!-- Tópico 10: Fases do Campeonato -->
        <div id="screen-intro" class="screen">
            <p id="stage-name" style="font-weight: 900; opacity: 0.4; letter-spacing: 5px;">OITAVAS DE FINAL</p>
            <h1 id="match-up">PLAYER VS CPU</h1>
            <button class="action-button" id="start-btn">ENTRAR EM CAMPO</button>
        </div>

        <!-- Tópico 19: Resultados e Reinício -->
        <div id="screen-result" class="screen">
            <h1 id="res-title">VITÓRIA!</h1>
            <p id="res-sub" style="font-size: 1.5rem; opacity: 0.6;">AVANÇANDO PARA AS QUARTAS</p>
            <button class="action-button" id="advance-btn">PRÓXIMA FASE</button>
            <button class="action-button hidden" id="retry-btn" onclick="location.reload()">TENTAR NOVAMENTE</button>
        </div>

        <!-- Tópico 14: Grande Final Recompensa -->
        <div id="screen-champ" class="screen">
            <div style="font-size: 10rem; margin-bottom: 1rem;">🏆</div>
            <h1>LENDA DO <span>BRASILEIRÃO 2026</span></h1>
            <h2 id="winner-club">TIME CAMPEÃO</h2>
            <button class="action-button" onclick="location.reload()">VOLTAR AO MENU</button>
        </div>
    </div>

    <script>
        /**
         * BRASILEIRÃO PENALTY STRIKE 2026 - FINAL V2.1
         * PROTOCOLO DE ENGENHARIA 21 PONTOS
         */

        const CLUBS = [
            { name: "Palmeiras", color: "#006400" }, { name: "Flamengo", color: "#ff0000" },
            { name: "Botafogo", color: "#000000" }, { name: "Fortaleza", color: "#001e9c" },
            { name: "São Paulo", color: "#ff0000" }, { name: "Internacional", color: "#e30613" },
            { name: "Cruzeiro", color: "#003399" }, { name: "Bahia", color: "#005baa" },
            { name: "Corinthians", color: "#ffffff" }, { name: "Vasco", color: "#000000" },
            { name: "Grêmio", color: "#00aae4" }, { name: "Atlético-MG", color: "#000000" },
            { name: "Fluminense", color: "#800020" }, { name: "Athletico-PR", color: "#cc0000" },
            { name: "Vitória", color: "#ff0000" }, { name: "Bragantino", color: "#ffffff" },
            { name: "Santos", color: "#ffffff" }, { name: "Coritiba", color: "#006400" },
            { name: "Mirassol", color: "#ffff00" }, { name: "Remo", color: "#000080" }
        ];

        const STAGES = ["Oitavas de Final", "Quartas de Final", "Semifinal", "Grande Final"];

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let cw, ch;

        // Tópico 2: Input State
        const inputState = {};
        window.onkeydown = (e) => { inputState[e.code] = true; };
        window.onkeyup = (e) => { inputState[e.code] = false; };

        // Globais de Controle (FSM)
        let gameState = 'MENU';
        let playerClub = null;
        let cpuClub = null;
        let currentDifficulty = 'normal';
        let currentStageIdx = 0;
        let pGoals = 0;
        let cGoals = 0;
        let activeTurn = 'PLAYER'; // PLAYER ou CPU

        // Objetos Dinâmicos
        const ball = { x: 0, y: 0, r: 16, startX: 0, startY: 0, targetX: 0, targetY: 0, progress: 0, moving: false };
        const reticle = { x: 0, y: 0, r: 30, t: 0 };
        const keeper = { x: 0, y: 0, w: 110, h: 45, targetX: 0 };

        function init() {
            setCanvasSize();
            window.addEventListener('resize', setCanvasSize);

            // Build UI
            const grid = document.getElementById('team-grid');
            CLUBS.forEach(club => {
                const btn = document.createElement('button');
                btn.className = 'team-btn';
                btn.innerText = club.name;
                btn.onclick = () => selectClub(club);
                grid.appendChild(btn);
            });

            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentDifficulty = btn.dataset.diff;
                };
            });

            document.getElementById('start-btn').onclick = startMatch;
            document.getElementById('advance-btn').onclick = promoteToNextStage;

            // Tópico 1: Start Loop
            gameEngineLoop();
        }

        function setCanvasSize() {
            cw = canvas.width = window.innerWidth;
            ch = canvas.height = window.innerHeight;
            if (ch > 720) ch = canvas.height = 720;
            if (cw > 1280) cw = canvas.width = 1280;
        }

        function selectClub(club) {
            playerClub = club;
            document.documentElement.style.setProperty('--team-color', club.color);
            setupTournamentStage();
        }

        function setupTournamentStage() {
            // Pick CPU Rival
            cpuClub = CLUBS[Math.floor(Math.random() * CLUBS.length)];
            while (cpuClub.name === playerClub.name) cpuClub = CLUBS[Math.floor(Math.random() * CLUBS.length)];

            document.getElementById('stage-name').innerText = STAGES[currentStageIdx].toUpperCase();
            document.getElementById('match-up').innerText = `${playerClub.name.toUpperCase()} VS ${cpuClub.name.toUpperCase()}`;
            switchUI('screen-intro');
        }

        function switchUI(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            if (id !== 'none') document.getElementById(id).classList.add('active');

            if (id === 'screen-menu') gameState = 'MENU';
            else if (id === 'screen-intro') gameState = 'INTRO';
            else if (id === 'none') {
                gameState = 'PLAYING';
                canvas.focus(); // Tópico 20: Validação de Foco
            }
            else gameState = 'UI';
        }

        function startMatch() {
            switchUI('none');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('p-label').innerText = playerClub.name.substring(0, 3).toUpperCase();
            document.getElementById('c-label').innerText = cpuClub.name.substring(0, 3).toUpperCase();

            // Tópico 11: Reset Obrigatório de Placar
            pGoals = 0; cGoals = 0;
            syncScoreUI();
            resetPositions();
        }

        function resetPositions() {
            ball.moving = false;
            ball.progress = 0;
            ball.x = cw / 2;
            ball.y = ch * 0.88;
            ball.startX = ball.x;
            ball.startY = ball.y;

            reticle.x = cw / 2;
            reticle.y = ch * 0.35;

            keeper.x = cw / 2 - keeper.w / 2;
            keeper.y = ch * 0.22;
            keeper.targetX = keeper.x;

            document.getElementById('feedback').style.opacity = '0';
        }

        // Tópico 1: Engine de 60 FPS
        function gameEngineLoop() {
            updateLogic();
            renderGraphics();
            requestAnimationFrame(gameEngineLoop);
        }

        function updateLogic() {
            if (gameState !== 'PLAYING') return;

            // Tópico 2 & 5: Movimentação de Input e Oscilação da Mira
            if (!ball.moving && activeTurn === 'PLAYER') {
                const moveSpeed = 7;
                if (inputState['KeyW'] || inputState['ArrowUp']) reticle.y -= moveSpeed;
                if (inputState['KeyS'] || inputState['ArrowDown']) reticle.y += moveSpeed;
                if (inputState['KeyA'] || inputState['ArrowLeft']) reticle.x -= moveSpeed;
                if (inputState['KeyD'] || inputState['ArrowRight']) reticle.x += moveSpeed;

                // Tópico 5: Oscilação Baseada na Dificuldade
                const oscFactor = { 'normal': 1, 'hard': 3, 'super': 6 }[currentDifficulty];
                reticle.t += 0.05;
                reticle.x += Math.sin(reticle.t) * oscFactor;
                reticle.y += Math.cos(reticle.t * 0.7) * (oscFactor / 2);

                // Bounds do Gol
                reticle.x = Math.max(cw * 0.28, Math.min(cw * 0.72, reticle.x));
                reticle.y = Math.max(ch * 0.15, Math.min(ch * 0.48, reticle.y));

                // Chute (Tópico 6)
                if (inputState['Space']) executeShot();
            }

            // Tópico 6: Física Lerp (0.5s Trajetória)
            if (ball.moving) {
                ball.progress += 0.0333; // 1/30 frames (~0.5s total)
                if (ball.progress >= 1) {
                    ball.progress = 1;
                    ball.moving = false;
                    processFinalPosition();
                }
                // Lerp Linear
                ball.x = ball.startX + (ball.targetX - ball.startX) * ball.progress;
                ball.y = ball.startY + (ball.targetY - ball.startY) * ball.progress;
            }

            // Tópico 7: IA do Goleiro Adversário
            if (activeTurn === 'PLAYER') {
                const speed = { 'normal': 0.04, 'hard': 0.15, 'super': 0.9 }[currentDifficulty];
                const reactionMs = { 'normal': 800, 'hard': 350, 'super': 0 }[currentDifficulty];

                if (currentDifficulty === 'super') {
                    keeper.targetX = reticle.x - keeper.w / 2;
                } else {
                    setTimeout(() => {
                        keeper.targetX = reticle.x - keeper.w / 2;
                    }, reactionMs);
                }
                keeper.x += (keeper.targetX - keeper.x) * speed;
            } else {
                // Tópico 8: Turno de Defesa (Jogador Goleiro)
                const gSpeed = 10;
                if (inputState['KeyA'] || inputState['ArrowLeft']) keeper.x -= gSpeed;
                if (inputState['KeyD'] || inputState['ArrowRight']) keeper.x += gSpeed;
            }

            // Bounds Goleiro
            keeper.x = Math.max(cw * 0.28, Math.min(cw * 0.72 - keeper.w, keeper.x));
        }

        function executeShot() {
            if (ball.moving) return;
            ball.moving = true;
            ball.progress = 0;
            ball.startX = ball.x;
            ball.startY = ball.y;
            ball.targetX = reticle.x;
            ball.targetY = reticle.y;

            if (activeTurn === 'CPU') {
                // IA escolhe canto (Tópico 8)
                const options = [cw * 0.32, cw * 0.5, cw * 0.68];
                ball.targetX = options[Math.floor(Math.random() * options.length)];
                ball.targetY = ch * 0.2 + Math.random() * (ch * 0.2);
            }
        }

        function processFinalPosition() {
            // Tópico 21: Sistema de Colisão do Goleiro
            const isSaved = (ball.x > keeper.x && ball.x < keeper.x + keeper.w &&
                ball.y > keeper.y && ball.y < keeper.y + keeper.h);

            const insideNet = (ball.x > cw * 0.28 && ball.x < cw * 0.72 && ball.y < ch * 0.5);

            let result = "ERROU";
            if (isSaved) {
                result = "SAVE";
            } else if (insideNet) {
                result = "GOAL";
                if (activeTurn === 'PLAYER') pGoals++; else cGoals++;
            }

            triggerFeedback(result);
            syncScoreUI();

            // Tópico 9: Condição de Vitória (3 Gols)
            setTimeout(() => {
                if (pGoals >= 3 || cGoals >= 3) {
                    showFinalMatchResult();
                } else {
                    alternateTurn();
                }
            }, 1800);
        }

        function triggerFeedback(type) {
            const feed = document.getElementById('feedback');
            const data = { 'GOAL': { t: 'GOOOL!', c: '#0f0' }, 'SAVE': { t: 'DEFENDEU!', c: '#f00' }, 'ERROU': { t: 'PARA FORA!', c: '#fff' } };

            feed.innerText = data[type].t;
            feed.style.color = data[type].c;
            feed.style.opacity = '1';

            if (type === 'GOAL') {
                document.getElementById('goal-flash').classList.add('flash-anim');
                setTimeout(() => document.getElementById('goal-flash').classList.remove('flash-anim'), 500);
            }
        }

        function syncScoreUI() {
            document.getElementById('pscore').innerText = pGoals;
            document.getElementById('cscore').innerText = cGoals;
        }

        function alternateTurn() {
            activeTurn = (activeTurn === 'PLAYER') ? 'CPU' : 'PLAYER';
            resetPositions();
            if (activeTurn === 'CPU') {
                setTimeout(executeShot, 1200); // CPU prepara e chuta
            }
        }

        function showFinalMatchResult() {
            switchUI('screen-result');
            document.getElementById('hud').classList.add('hidden');

            if (pGoals >= 3) {
                document.getElementById('res-title').innerText = "VITORIA!";
                const next = STAGES[currentStageIdx + 1];
                document.getElementById('res-sub').innerText = next ? "AVANÇANDO PARA AS " + next.toUpperCase() : "CAMPEÃO DO BRASILEIRÃO 2026!";
                document.getElementById('advance-btn').classList.remove('hidden');
                document.getElementById('retry-btn').classList.add('hidden');
            } else {
                document.getElementById('res-title').innerText = "ELIMINADO!";
                document.getElementById('res-sub').innerText = "O TIME NÃO AGUENTOU A PRESSÃO.";
                document.getElementById('advance-btn').classList.add('hidden');
                document.getElementById('retry-btn').classList.remove('hidden');
            }
        }

        function promoteToNextStage() {
            currentStageIdx++;
            if (currentStageIdx >= STAGES.length) {
                document.getElementById('winner-club').innerText = playerClub.name.toUpperCase();
                switchUI('screen-champ');
            } else {
                setupTournamentStage();
            }
        }

        // Tópico 4 & 17: Renderização Gráfica
        function renderGraphics() {
            ctx.clearRect(0, 0, cw, ch);
            if (gameState === 'MENU' || gameState === 'INTRO') return;

            // Pitch Borders
            ctx.strokeStyle = "rgba(0, 255, 136, 0.15)";
            ctx.lineWidth = 15;
            ctx.strokeRect(cw * 0.25, ch * 0.1, cw * 0.5, ch * 0.85);

            // Goal Net (Tópico 4)
            ctx.fillStyle = "rgba(255, 255, 255, 0.05)";
            ctx.fillRect(cw * 0.28, ch * 0.12, cw * 0.44, ch * 0.1);
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 6;
            ctx.strokeRect(cw * 0.28, ch * 0.12, cw * 0.44, ch * 0.1);

            // Goal Draw Logic
            ctx.lineWidth = 1;
            ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
            for (let i = cw * 0.28; i < cw * 0.72; i += 15) {
                ctx.beginPath(); ctx.moveTo(i, ch * 0.12); ctx.lineTo(i, ch * 0.22); ctx.stroke();
            }

            // Goleiro (Tópico 7)
            const kColor = activeTurn === 'PLAYER' ? cpuClub.color : playerClub.color;
            ctx.fillStyle = kColor;
            ctx.shadowBlur = 15;
            ctx.shadowColor = kColor;
            ctx.fillRect(keeper.x, keeper.y, keeper.w, keeper.h);
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
            ctx.strokeRect(keeper.x, keeper.y, keeper.w, keeper.h);
            ctx.shadowBlur = 0;

            // Mira / Retículo (Tópico 5)
            if (!ball.moving && (activeTurn === 'PLAYER')) {
                ctx.beginPath();
                ctx.arc(reticle.x, reticle.y, reticle.r, 0, Math.PI * 2);
                ctx.strokeStyle = playerClub.color;
                ctx.setLineDash([5, 5]);
                ctx.lineWidth = 4;
                ctx.stroke();
                ctx.setLineDash([]);
                // Centro
                ctx.beginPath(); ctx.arc(reticle.x, reticle.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = "#fff"; ctx.fill();
            }

            // Bola (Tópico 6)
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
            ctx.fillStyle = "#fff";
            ctx.fill();
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#fff";
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Marca de Pênalti
            ctx.fillStyle = "rgba(255, 255, 255, 0.1)";
            ctx.beginPath(); ctx.arc(cw / 2, ch * 0.88, 5, 0, Math.PI * 2); ctx.fill();
        }

        window.onload = init;
    </script>
</body>

</html>
