<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRASILEIRÃO PENALTY STRIKE 2026 - V 5.0 ANTI-BUG</title>
    <style>
        :root {
            --neon-light: #00ffcc;
            --pitch-bg: #051406;
            --p-color: #00ffcc;
            --hud-glass: rgba(0, 0, 0, 0.9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1280px;
            max-height: 720px;
            border: 2px solid #222;
            overflow: hidden;
        }

        canvas {
            display: block;
            background: var(--pitch-bg);
            cursor: none;
        }

        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.96);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .overlay-screen.active {
            display: flex;
        }

        h1 {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: -2px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        h1 span {
            color: var(--neon-light);
            text-shadow: 0 0 30px var(--neon-light);
        }

        .team-box {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 90%;
            max-width: 1000px;
            max-height: 400px;
            overflow-y: auto;
            background: #0a0a0a;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #333;
        }

        .team-item {
            background: #111;
            border: 1.5px solid #222;
            color: #fff;
            padding: 15px;
            font-weight: 800;
            cursor: pointer;
            border-radius: 8px;
            text-transform: uppercase;
            font-size: 0.75rem;
            transition: 0.2s;
        }

        .team-item:hover {
            border-color: var(--neon-light);
            background: #1a1a1a;
            transform: scale(1.05);
        }

        .diff-selector {
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
        }

        .diff-opt {
            background: #111;
            border: 2.5px solid #222;
            color: #666;
            padding: 10px 25px;
            font-weight: 900;
            cursor: pointer;
            border-radius: 5px;
        }

        .diff-opt.active {
            border-color: var(--neon-light);
            color: #fff;
            background: rgba(0, 255, 204, 0.1);
        }

        .main-cta {
            background: var(--neon-light);
            color: #000;
            border: none;
            padding: 1.2rem 4rem;
            font-size: 1.8rem;
            font-weight: 950;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 30px;
            transition: 0.3s;
        }

        .main-cta:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 50px var(--neon-light);
        }

        .hud-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px;
            pointer-events: none;
            z-index: 50;
        }

        .hud-label {
            background: var(--hud-glass);
            border-bottom: 4px solid var(--p-color);
            padding: 10px 30px;
            border-radius: 5px;
            font-weight: 900;
            font-size: 1.2rem;
        }

        .score-num {
            font-size: 3.5rem;
            font-weight: 950;
            color: #fff;
            text-shadow: 0 0 15px var(--neon-light);
        }

        .feedback-txt {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem;
            font-weight: 950;
            z-index: 80;
            text-transform: uppercase;
            color: #fff;
            pointer-events: none;
            opacity: 0;
            transition: 0.2s;
        }

        .kill-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 45;
        }

        .flash-anim {
            animation: flash-play 0.5s ease-out;
        }

        @keyframes flash-play {
            0% {
                opacity: 0.8;
            }

            100% {
                opacity: 0;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--neon-light);
            border-radius: 5px;
        }

        .hide {
            display: none !important;
        }
    </style>
</head>

<body>
    <div id="stage">
        <!-- Tópico 26: Kill Layer -->
        <div id="flash-fx" class="kill-flash"></div>
        <canvas id="game-cv"></canvas>

        <!-- Tópico 16: UI -->
        <div id="match-hud" class="hud-top hide">
            <div class="hud-label" id="lbl-p">PLAYER</div>
            <div class="score-num"><span id="sc-p">0</span> : <span id="sc-c">0</span></div>
            <div class="hud-label" id="lbl-c">CPU</div>
        </div>

        <div id="pop-msg" class="feedback-txt">GOOOL!</div>

        <!-- Tópico 3: Seleção -->
        <div id="scr-menu" class="overlay-screen active">
            <h1>BRASILEIRÃO <span>PENALTY 2026</span></h1>

            <div class="diff-selector">
                <button class="diff-opt active" data-v="normal">NORMAL</button>
                <button class="diff-opt" data-v="hard">HARD</button>
                <button class="diff-opt" data-v="super">SUPER HARD</button>
            </div>

            <p style="margin-bottom: 15px; font-weight: 900; opacity: 0.4; font-size: 0.8rem;">CLUBES SÉRIE A 2026:</p>
            <div class="team-box" id="team-list"></div>
        </div>

        <!-- Tópico 10: Chaveamento -->
        <div id="scr-stage" class="overlay-screen">
            <p id="stg-name"
                style="font-weight: 950; color: var(--neon-light); letter-spacing: 15px; margin-bottom: 10px;">OITAVAS
                DE FINAL</p>
            <h1 id="match-up">CLUBE VS RIVAL</h1>
            <button class="main-cta" id="go-pitch">ROLA A BOLA</button>
        </div>

        <!-- Tópico 19: Resultado do Jogo -->
        <div id="scr-res" class="overlay-screen">
            <h1 id="res-st">VITÓRIA!</h1>
            <p id="res-info" style="font-size: 1.5rem; opacity: 0.6;">CLASSIFICADO PARA A PRÓXIMA FASE</p>
            <button class="main-cta" id="go-next">PRÓXIMA FASE</button>
            <button class="main-cta hide" id="go-retry" onclick="location.reload()">RECOMEÇAR TUDO</button>
        </div>

        <!-- Tópico 19: Final -->
        <div id="scr-final" class="overlay-screen">
            <div style="font-size: 12rem; margin-bottom: 2rem;">🏆</div>
            <h1>GRANDE <span>CAMPEÃO 2026</span></h1>
            <h2 id="champ-name" style="font-size: 2.5rem; color: var(--neon-light);">SEU TIME</h2>
            <button class="main-cta" onclick="location.reload()">SAIR</button>
        </div>
    </div>

    <script>
        /**
         * BRASILEIRÃO PENALTY STRIKE 2026 - V 5.0 ANTI-BUG
         * PROTOCOLO DE ENGENHARIA 26 PONTOS
         */

        const CLUBS = [
            { id: 0, name: "Palmeiras", color: "#006400" }, { id: 1, name: "Flamengo", color: "#ff0000" },
            { id: 2, name: "Botafogo", color: "#000000" }, { id: 3, name: "Fortaleza", color: "#001e9c" },
            { id: 4, name: "São Paulo", color: "#ff0000" }, { id: 5, name: "Internacional", color: "#e30613" },
            { id: 6, name: "Cruzeiro", color: "#003399" }, { id: 7, name: "Bahia", color: "#005baa" },
            { id: 8, name: "Corinthians", color: "#ffffff" }, { id: 9, name: "Vasco", color: "#000000" },
            { id: 10, name: "Grêmio", color: "#00aae4" }, { id: 11, name: "Atlético-MG", color: "#000000" },
            { id: 12, name: "Fluminense", color: "#800020" }, { id: 13, name: "Athletico-PR", color: "#cc0000" },
            { id: 14, name: "Vitória", color: "#ff0000" }, { id: 15, name: "Bragantino", color: "#ffffff" },
            { id: 16, name: "Santos", color: "#ffffff" }, { id: 17, name: "Coritiba", color: "#006400" },
            { id: 18, name: "Mirassol", color: "#ffff00" }, { id: 19, name: "Remo", color: "#000080" }
        ];

        const STAGES = ["Oitavas de Final", "Quartas de Final", "Semifinal", "Grande Final"];

        const canvas = document.getElementById('game-cv');
        const ctx = canvas.getContext('2d');
        let cw, ch;

        // Tópico 2: Input State
        const keys = {};
        window.onkeydown = (e) => { keys[e.code] = true; };
        window.onkeyup = (e) => { keys[e.code] = false; };

        // Tópico 25: Máquina de Estados (switch(gState))
        let gState = 'MENU'; // MENU, INTRO, PLAYING, RESULT, PHASE_END
        let pTeam = null;
        let cTeam = null;
        let diff = 'normal';
        let tourStage = 0;
        let pPoints = 0;
        let cPoints = 0;
        let isPlayerKicker = true;
        let antiFreezeTimer = null; // Tópico 23 safety

        // Game Objects
        const ball = { x: 0, y: 0, r: 18, startX: 0, startY: 0, targetX: 0, targetY: 0, t: 0, active: false, blocked: false };
        const reticle = { x: 0, y: 0, r: 35, time: 0 };
        const keeper = { x: 0, y: 0, w: 125, h: 55, targetX: 0 };
        const pBurst = []; // Particles

        function init() {
            setResolution();
            window.addEventListener('resize', setResolution);

            // Populate Teams
            const list = document.getElementById('team-list');
            CLUBS.forEach(club => {
                const btn = document.createElement('button');
                btn.className = 'team-item';
                btn.innerText = club.name;
                btn.onclick = () => selectTeam(club);
                list.appendChild(btn);
            });

            document.querySelectorAll('.diff-opt').forEach(opt => {
                opt.onclick = () => {
                    document.querySelectorAll('.diff-opt').forEach(o => o.classList.remove('active'));
                    opt.classList.add('active');
                    diff = opt.dataset.v;
                };
            });

            document.getElementById('go-pitch').onclick = runMatch;
            document.getElementById('go-next').onclick = movePhase;

            // Tópico 1: Start Loop
            tick();
        }

        function setResolution() {
            cw = canvas.width = window.innerWidth;
            ch = canvas.height = window.innerHeight;
            if (ch > 720) ch = canvas.height = 720;
            if (cw > 1280) cw = canvas.width = 1280;
        }

        function selectTeam(club) {
            pTeam = club;
            document.documentElement.style.setProperty('--p-color', club.color);
            cTeam = CLUBS[Math.floor(Math.random() * CLUBS.length)];
            while (cTeam.id === pTeam.id) cTeam = CLUBS[Math.floor(Math.random() * CLUBS.length)];

            document.getElementById('stg-name').innerText = STAGES[tourStage].toUpperCase();
            document.getElementById('match-up').innerText = `${pTeam.name.toUpperCase()} VS ${cTeam.name.toUpperCase()}`;
            changeState('INTRO');
        }

        function changeState(st) {
            gState = st;
            document.querySelectorAll('.overlay-screen').forEach(s => s.classList.remove('active'));
            if (st === 'MENU') document.getElementById('scr-menu').classList.add('active');
            else if (st === 'INTRO') document.getElementById('scr-stage').classList.add('active');
            else if (st === 'PHASE_END') document.getElementById('scr-res').classList.add('active');
            else if (st === 'FINALE') document.getElementById('scr-final').classList.add('active');
            else if (st === 'PLAYING') {
                canvas.focus(); // Tópico 20
                document.getElementById('match-hud').classList.remove('hide');
            }
        }

        function runMatch() {
            pPoints = 0; cPoints = 0; // Tópico 11 Reset
            syncHud();
            prepRound();
        }

        function prepRound() {
            // Tópico 26: Kill Switch Reset
            ball.active = false;
            ball.blocked = false;
            ball.t = 0;
            ball.x = cw / 2;
            ball.y = ch * 0.9;
            ball.startX = ball.x; ball.startY = ball.y;

            reticle.x = cw / 2;
            reticle.y = ch * 0.35;

            keeper.x = cw / 2 - keeper.w / 2;
            keeper.y = ch * 0.22;
            keeper.targetX = keeper.x;

            document.getElementById('pop-msg').style.opacity = '0';
            changeState('PLAYING');

            if (!isPlayerKicker) {
                setTimeout(shoot, 1500);
            }
        }

        function tick() {
            switch (gState) {
                case 'PLAYING': updatePhysics(); break;
            }
            draw();
            requestAnimationFrame(tick);
        }

        function updatePhysics() {
            // Tópico 2 & 5: Mira
            if (!ball.active && isPlayerKicker) {
                const s = 8;
                if (keys['KeyW'] || keys['ArrowUp']) reticle.y -= s;
                if (keys['KeyS'] || keys['ArrowDown']) reticle.y += s;
                if (keys['KeyA'] || keys['ArrowLeft']) reticle.x -= s;
                if (keys['KeyD'] || keys['ArrowRight']) reticle.x += s;

                // Drift/Oscillation
                const osc = { 'normal': 1.2, 'hard': 4, 'super': 9 }[diff];
                reticle.time += 0.05;
                reticle.x += Math.sin(reticle.time) * osc;
                reticle.y += Math.cos(reticle.time * 0.8) * (osc / 2);

                reticle.x = Math.max(cw * 0.3, Math.min(cw * 0.7, reticle.x));
                reticle.y = Math.max(ch * 0.1, Math.min(ch * 0.48, reticle.y));

                if (keys['Space']) shoot();
            }

            // Tópico 6: Lerp Trajectory
            if (ball.active) {
                ball.t += 0.0333; // 0.5s duration approx
                if (ball.t >= 1) {
                    ball.t = 1;
                    ball.active = false;
                    concludeRound();
                }
                ball.x = ball.startX + (ball.targetX - ball.startX) * ball.t;
                ball.y = ball.startY + (ball.targetY - ball.startY) * ball.t;

                // Tópico 21, 22 & 26: Frame Collision & Kill Switch
                if (!ball.blocked) {
                    if (ball.x > keeper.x && ball.x < keeper.x + keeper.w &&
                        ball.y > keeper.y && ball.y < keeper.y + keeper.h) {

                        // Tópico 26 KILL SWITCH
                        ball.blocked = true;
                        ball.active = false;
                        ball.x = -100; ball.y = -100; // Remove from view
                        spawnBurst(keeper.x + keeper.w / 2, keeper.y + keeper.h / 2);
                        concludeRound();
                    }
                }
            }

            // Tópico 7: Keeper IA
            if (isPlayerKicker) {
                const speed = { 'normal': 0.035, 'hard': 0.16, 'super': 0.98 }[diff];
                const delay = { 'normal': 800, 'hard': 320, 'super': 0 }[diff];

                if (diff === 'super' || ball.active) {
                    keeper.targetX = (ball.active) ? ball.x - keeper.w / 2 : reticle.x - keeper.w / 2;
                } else {
                    setTimeout(() => { keeper.targetX = reticle.x - keeper.w / 2; }, delay);
                }
                keeper.x += (keeper.targetX - keeper.x) * speed;
            } else {
                // Tópico 8: Player Keeper
                const speed = 13;
                if (keys['KeyA'] || keys['ArrowLeft']) keeper.x -= speed;
                if (keys['KeyD'] || keys['ArrowRight']) keeper.x += speed;
            }
            keeper.x = Math.max(cw * 0.3, Math.min(cw * 0.7 - keeper.w, keeper.x));

            // Particles
            for (let i = pBurst.length - 1; i >= 0; i--) {
                pBurst[i].x += pBurst[i].vx;
                pBurst[i].y += pBurst[i].vy;
                pBurst[i].l -= 2;
                if (pBurst[i].l <= 0) pBurst.splice(i, 1);
            }
        }

        function shoot() {
            if (ball.active) return;
            ball.active = true;
            ball.blocked = false;
            ball.t = 0;
            ball.startX = ball.x; ball.startY = ball.y;
            ball.targetX = reticle.x; ball.targetY = reticle.y;

            if (!isPlayerKicker) {
                // CPU decides
                ball.targetX = cw * 0.33 + Math.random() * (cw * 0.34);
                ball.targetY = ch * 0.15 + Math.random() * (ch * 0.3);
            }
        }

        function concludeRound() {
            if (gState !== 'PLAYING') return;
            changeState('RESULT');

            const scored = (football === ball && !ball.blocked && ball.x > cw * 0.3 && ball.x < cw * 0.7 && ball.y < ch * 0.45);

            let status = "OUT";
            if (ball.blocked) {
                status = "SAVE";
            } else if (scored) {
                status = "GOAL";
                if (isPlayerKicker) pPoints++; else cPoints++;
            }

            flashMsg(status);
            syncHud();

            // Tópico 23 & 25: Mandatory Transition Timer (Safety)
            clearTimeout(antiFreezeTimer);
            antiFreezeTimer = setTimeout(() => {
                flowToNext();
            }, 1700);
        }

        function flowToNext() {
            // Tópico 9: Sudden Death 3 Gols
            if (pPoints >= 3 || cPoints >= 3) {
                changeState('PHASE_END');
                document.getElementById('match-hud').classList.add('hide');

                if (pPoints >= 3) {
                    document.getElementById('res-st').innerText = "VITÓRIA!";
                    const next = STAGES[tourStage + 1];
                    document.getElementById('res-info').innerText = next ? "RUMO ÀS " + next.toUpperCase() : "O TROFÉU É SEU!";
                    document.getElementById('go-next').classList.remove('hide');
                    document.getElementById('go-retry').classList.add('hide');
                } else {
                    document.getElementById('res-st').innerText = "DERROTA!";
                    document.getElementById('res-info').innerText = "ELIMINADO DO BRASILEIRÃO.";
                    document.getElementById('go-next').classList.add('hide');
                    document.getElementById('go-retry').classList.remove('hide');
                }
            } else {
                isPlayerKicker = !isPlayerKicker;
                prepRound();
            }
        }

        function flashMsg(type) {
            const el = document.getElementById('pop-msg');
            const map = { 'GOAL': { t: 'GOOOL!', c: '#0f0' }, 'SAVE': { t: 'DEFENDEU!', c: '#f00' }, 'OUT': { t: 'PARA FORA!', c: '#fff' } };

            el.innerText = map[type].t;
            el.style.color = map[type].c;
            el.style.opacity = '1';

            if (type === 'GOAL') {
                document.getElementById('flash-fx').classList.add('flash-anim');
                setTimeout(() => document.getElementById('flash-fx').classList.remove('flash-anim'), 500);
            }
        }

        function syncHud() {
            document.getElementById('sc-p').innerText = pPoints;
            document.getElementById('sc-c').innerText = cPoints;
            document.getElementById('lbl-p').innerText = pTeam ? pTeam.name.substring(0, 3).toUpperCase() : "PLY";
            document.getElementById('lbl-c').innerText = cTeam ? cTeam.name.substring(0, 3).toUpperCase() : "CPU";
        }

        function movePhase() {
            tourStage++;
            if (tourStage >= STAGES.length) {
                document.getElementById('champ-name').innerText = pTeam.name.toUpperCase();
                changeState('FINALE');
            } else {
                selectTeam(pTeam);
            }
        }

        function spawnBurst(x, y) {
            for (let i = 0; i < 15; i++) {
                pBurst.push({ x, y, vx: (Math.random() - 0.5) * 15, vy: (Math.random() - 0.5) * 15, l: 100, c: pTeam.color });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, cw, ch);
            if (gState === 'MENU' || gState === 'INTRO') return;

            // Pitch
            ctx.strokeStyle = "rgba(0, 255, 204, 0.1)";
            ctx.lineWidth = 8;
            ctx.strokeRect(cw * 0.28, ch * 0.1, cw * 0.44, ch * 0.88);

            // Tópico 4: Gol
            ctx.fillStyle = "rgba(255,255,255,0.05)";
            ctx.fillRect(cw * 0.3, ch * 0.15, cw * 0.4, ch * 0.1);
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 4;
            ctx.strokeRect(cw * 0.3, ch * 0.15, cw * 0.4, ch * 0.1);

            // Keeper (Tópico 21)
            const kC = isPlayerKicker ? cTeam.color : pTeam.color;
            ctx.fillStyle = kC; ctx.shadowBlur = 20; ctx.shadowColor = kC;
            ctx.fillRect(keeper.x, keeper.y, keeper.w, keeper.h);
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
            ctx.strokeRect(keeper.x, keeper.y, keeper.w, keeper.h);
            ctx.shadowBlur = 0;

            // Mira (Tópico 5)
            if (!ball.active && isPlayerKicker) {
                ctx.beginPath(); ctx.arc(reticle.x, reticle.y, reticle.r, 0, Math.PI * 2);
                ctx.strokeStyle = pTeam.color; ctx.lineWidth = 4; ctx.setLineDash([8, 4]);
                ctx.stroke(); ctx.setLineDash([]);
                ctx.beginPath(); ctx.moveTo(reticle.x - 10, reticle.y); ctx.lineTo(reticle.x + 10, reticle.y); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(reticle.x, reticle.y - 10); ctx.lineTo(reticle.x, reticle.y + 10); ctx.stroke();
            }

            // Bola (Tópico 6)
            if (ball.active || gState === 'PLAYING') {
                ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
                ctx.fillStyle = "#fff"; ctx.fill();
                ctx.shadowBlur = 10; ctx.shadowColor = "#fff"; ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // Particles
            pBurst.forEach(p => {
                ctx.fillStyle = p.c; ctx.globalAlpha = p.l / 100;
                ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        window.onload = init;
    </script>
</body>

</html>
