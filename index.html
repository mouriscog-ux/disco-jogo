<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRASILEIRÃO PENALTY STRIKE 2026 - V 3.0</title>
    <style>
        :root {
            --neon-green: #00ff88;
            --pitch: #0a1f0b;
            --hud-bg: rgba(0, 0, 0, 0.9);
            --p-color: #00ff88;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1280px;
            max-height: 720px;
            overflow: hidden;
            border: 3px solid #1a1a1a;
        }

        canvas {
            display: block;
            background: var(--pitch);
            cursor: none;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.98);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .screen.active {
            display: flex;
        }

        h1 {
            font-size: 4rem;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            line-height: 0.9;
            margin-bottom: 2rem;
        }

        h1 span {
            color: var(--neon-green);
            text-shadow: 0 0 20px var(--neon-green);
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            width: 90%;
            max-width: 1000px;
            max-height: 400px;
            overflow-y: auto;
            background: #050505;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #333;
        }

        .team-btn {
            background: #111;
            border: 2px solid #222;
            color: #fff;
            padding: 20px;
            font-weight: 950;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 10px;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .team-btn:hover {
            border-color: var(--neon-green);
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
        }

        .diff-row {
            margin-bottom: 3rem;
            display: flex;
            gap: 20px;
        }

        .diff-btn {
            background: #111;
            border: 2px solid #222;
            color: #fff;
            padding: 15px 30px;
            font-weight: 800;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
        }

        .diff-btn.active {
            border-color: var(--neon-green);
            background: rgba(0, 255, 136, 0.1);
        }

        .btn-main {
            background: var(--neon-green);
            color: #000;
            border: none;
            padding: 1.5rem 5rem;
            font-size: 2rem;
            font-weight: 950;
            border-radius: 100px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 2rem;
            transition: 0.3s;
        }

        .btn-main:hover {
            transform: scale(1.1);
            box-shadow: 0 0 60px var(--neon-green);
        }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 60px;
            pointer-events: none;
            z-index: 50;
        }

        .hud-unit {
            background: var(--hud-bg);
            border-bottom: 5px solid var(--p-color);
            padding: 15px 40px;
            border-radius: 10px;
            font-weight: 950;
            font-size: 1.5rem;
        }

        .score-display {
            font-size: 4rem;
            font-weight: 950;
            text-shadow: 0 0 30px var(--neon-green);
        }

        .overlay-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10rem;
            font-weight: 900;
            font-style: italic;
            z-index: 70;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            opacity: 0;
            transition: 0.2s;
        }

        .goal-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 45;
        }

        .flash-fire {
            animation: flash-anim 0.4s ease-out;
        }

        @keyframes flash-anim {
            0% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--neon-green);
            border-radius: 10px;
        }
    </style>
</head>

<body id="body">
    <div id="container">
        <!-- Tópico 4: Arena -->
        <div id="flash-layer" class="goal-flash"></div>
        <canvas id="gameCanvas"></canvas>

        <div id="hud" class="hud hidden">
            <div class="hud-unit" id="player-label">PALMEIRAS</div>
            <div class="score-display"><span id="score-p">0</span> : <span id="score-c">0</span></div>
            <div class="hud-unit" id="cpu-label">CPU</div>
        </div>

        <div id="msg" class="overlay-msg">GOOOL!</div>

        <!-- Tópico 3: Menu -->
        <div id="screen-menu" class="screen active">
            <h1>PENALTY <span>STRIKE 2026</span></h1>

            <div class="diff-row">
                <button class="diff-btn active" data-diff="normal">NORMAL</button>
                <button class="diff-btn" data-diff="hard">HARD</button>
                <button class="diff-btn" data-diff="super">SUPER HARD</button>
            </div>

            <p style="margin-bottom: 20px; font-weight: 900; opacity: 0.6;">ESCOLHA SEU TIME DA SÉRIE A:</p>
            <div class="team-grid" id="team-grid"></div>
        </div>

        <!-- Tópico 10: Campeonato -->
        <div id="screen-intro" class="screen">
            <p id="stage-text"
                style="font-weight: 900; font-size: 1.5rem; color: var(--neon-green); letter-spacing: 8px; margin-bottom: 1rem;">
                OITAVAS DE FINAL</p>
            <h1 id="match-up-text">PALMEIRAS VS FLAMENGO</h1>
            <button class="btn-main" id="start-btn">ENTRAR EM CAMPO</button>
        </div>

        <!-- Tópico 19: Resultado -->
        <div id="screen-result" class="screen">
            <h1 id="res-title-text">VITÓRIA!</h1>
            <p id="res-sub-text" style="font-size: 2rem; opacity: 0.5;">RUMO ÀS QUARTAS DE FINAL</p>
            <button class="btn-main" id="next-btn">PRÓXIMA FASE</button>
            <button class="btn-main hidden" id="retry-btn" onclick="location.reload()">TENTAR NOVAMENTE</button>
        </div>

        <!-- Finale -->
        <div id="screen-finale" class="screen">
            <div style="font-size: 12rem; margin-bottom: 2rem;">🏆</div>
            <h1>LENDA DO <span>BRASILEIRÃO 2026</span></h1>
            <h2 id="champ-club-name" style="font-size: 3rem;">TIME</h2>
            <button class="btn-main" onclick="location.reload()">MENU PRINCIPAL</button>
        </div>
    </div>

    <script>
        /**
         * BRASILEIRÃO PENALTY STRIKE 2026 - V 3.0
         * PROTOCOLO DE ENGENHARIA 22 PONTOS
         */

        const CLUBS = [
            { name: "Palmeiras", color: "#006400" }, { name: "Flamengo", color: "#ff0000" },
            { name: "Botafogo", color: "#000000" }, { name: "Fortaleza", color: "#001e9c" },
            { name: "São Paulo", color: "#ff0000" }, { name: "Internacional", color: "#e30613" },
            { name: "Cruzeiro", color: "#003399" }, { name: "Bahia", color: "#005baa" },
            { name: "Corinthians", color: "#ffffff" }, { name: "Vasco", color: "#000000" },
            { name: "Grêmio", color: "#00aae4" }, { name: "Atlético-MG", color: "#000000" },
            { name: "Fluminense", color: "#800020" }, { name: "Athletico-PR", color: "#cc0000" },
            { name: "Vitória", color: "#ff0000" }, { name: "Bragantino", color: "#ffffff" },
            { name: "Santos", color: "#ffffff" }, { name: "Coritiba", color: "#006400" },
            { name: "Mirassol", color: "#ffff00" }, { name: "Remo", color: "#000080" }
        ];

        const STAGES = ["Oitavas de Final", "Quartas de Final", "Semifinal", "Grande Final"];

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let cw, ch;

        // Tópico 2: Input State
        const inputState = {};
        window.onkeydown = (e) => { inputState[e.code] = true; };
        window.onkeyup = (e) => { inputState[e.code] = false; };

        // Globais FSM
        let gameState = 'MENU';
        let playerTeam = null;
        let cpuTeam = null;
        let diff = 'normal';
        let stageIdx = 0;
        let pScore = 0;
        let cScore = 0;
        let currentTurn = 'PLAYER'; // PLAYER ou CPU

        // Game Objects
        const ball = { x: 0, y: 0, r: 18, startX: 0, startY: 0, targetX: 0, targetY: 0, t: 0, moving: false, blocked: false };
        const aim = { x: 0, y: 0, r: 35, time: 0 };
        const goalie = { x: 0, y: 0, w: 120, h: 50, targetX: 0 };

        function init() {
            setResolution();
            window.addEventListener('resize', setResolution);

            // Build Menu
            const grid = document.getElementById('team-grid');
            CLUBS.forEach(club => {
                const btn = document.createElement('button');
                btn.className = 'team-btn';
                btn.innerText = club.name;
                btn.onclick = () => selectTeam(club);
                grid.appendChild(btn);
            });

            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    diff = btn.dataset.diff;
                };
            });

            document.getElementById('start-btn').onclick = startMatch;
            document.getElementById('next-btn').onclick = advanceTournament;

            // Tópico 1: Boot Loop
            tick();
        }

        function setResolution() {
            cw = canvas.width = window.innerWidth;
            ch = canvas.height = window.innerHeight;
            if (ch > 720) ch = canvas.height = 720;
            if (cw > 1280) cw = canvas.width = 1280;
        }

        function selectTeam(club) {
            playerTeam = club;
            document.documentElement.style.setProperty('--p-color', club.color);
            prepareMatchIntro();
        }

        function prepareMatchIntro() {
            cpuTeam = CLUBS[Math.floor(Math.random() * CLUBS.length)];
            while (cpuTeam.name === playerTeam.name) cpuTeam = CLUBS[Math.floor(Math.random() * CLUBS.length)];

            document.getElementById('stage-text').innerText = STAGES[stageIdx].toUpperCase();
            document.getElementById('match-up-text').innerText = `${playerTeam.name.toUpperCase()} VS ${cpuTeam.name.toUpperCase()}`;
            setScreen('screen-intro');
        }

        function setScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            if (id !== 'none') document.getElementById(id).classList.add('active');

            if (id === 'screen-menu') gameState = 'MENU';
            else if (id === 'screen-intro') gameState = 'INTRO';
            else if (id === 'none') {
                gameState = 'PLAYING';
                canvas.focus(); // Tópico 20
            } else gameState = 'UI';
        }

        function startMatch() {
            setScreen('none');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('player-label').innerText = playerTeam.name.substring(0, 3).toUpperCase();
            document.getElementById('cpu-label').innerText = cpuTeam.name.substring(0, 3).toUpperCase();

            // Tópico 11: Reset
            pScore = 0; cScore = 0;
            updateScoreHUD();
            resetPositions();
        }

        function resetPositions() {
            ball.moving = false;
            ball.blocked = false;
            ball.t = 0;
            ball.x = cw / 2;
            ball.y = ch * 0.9;
            ball.startX = ball.x;
            ball.startY = ball.y;

            aim.x = cw / 2;
            aim.y = ch * 0.35;

            goalie.x = cw / 2 - goalie.w / 2;
            goalie.y = ch * 0.2;
            goalie.targetX = goalie.x;

            document.getElementById('msg').style.opacity = '0';
        }

        // Tópico 1: Loop de 60 FPS
        function tick() {
            update();
            render();
            requestAnimationFrame(tick);
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            // Tópico 2 & 5: Input e Oscilação
            if (!ball.moving && currentTurn === 'PLAYER') {
                const speed = 8;
                if (inputState['KeyW'] || inputState['ArrowUp']) aim.y -= speed;
                if (inputState['KeyS'] || inputState['ArrowDown']) aim.y += speed;
                if (inputState['KeyA'] || inputState['ArrowLeft']) aim.x -= speed;
                if (inputState['KeyD'] || inputState['ArrowRight']) aim.x += speed;

                // Tópico 5: Dificuldade
                const osc = { 'normal': 1, 'hard': 3.5, 'super': 7 }[diff];
                aim.time += 0.05;
                aim.x += Math.sin(aim.time) * osc;
                aim.y += Math.cos(aim.time * 0.8) * (osc / 1.5);

                // Goal Constraints
                aim.x = Math.max(cw * 0.3, Math.min(cw * 0.7, aim.x));
                aim.y = Math.max(ch * 0.15, Math.min(ch * 0.45, aim.y));

                if (inputState['Space']) kick();
            }

            // Tópico 6: Física Lerp (0.5s)
            if (ball.moving) {
                ball.t += 0.0333; // 1/30 para 0.5s
                if (ball.t >= 1) {
                    ball.t = 1;
                    ball.moving = false;
                    validateGoal();
                }
                ball.x = ball.startX + (ball.targetX - ball.startX) * ball.t;
                ball.y = ball.startY + (ball.targetY - ball.startY) * ball.t;

                // Tópico 21 & 22: Colisão Frame-a-Frame do Goleiro
                if (!ball.blocked) {
                    if (ball.x > goalie.x && ball.x < goalie.x + goalie.w &&
                        ball.y > goalie.y && ball.y < goalie.y + goalie.h) {

                        ball.blocked = true;
                        ball.moving = false;
                        ball.t = 1;
                        showResult("SAVE");
                    }
                }
            }

            // Tópico 7: IA Goleiro
            if (currentTurn === 'PLAYER') {
                const aiSpeed = { 'normal': 0.03, 'hard': 0.12, 'super': 0.95 }[diff];
                const aiDelay = { 'normal': 750, 'hard': 300, 'super': 0 }[diff];

                if (diff === 'super') {
                    goalie.targetX = aim.x - goalie.w / 2;
                } else {
                    setTimeout(() => {
                        goalie.targetX = aim.x - goalie.w / 2;
                    }, aiDelay);
                }
                goalie.x += (goalie.targetX - goalie.x) * aiSpeed;
            } else {
                // Tópico 8: Jogador Defende
                const gMove = 12;
                if (inputState['KeyA'] || inputState['ArrowLeft']) goalie.x -= gMove;
                if (inputState['KeyD'] || inputState['ArrowRight']) goalie.x += gMove;
            }

            goalie.x = Math.max(cw * 0.28, Math.min(cw * 0.72 - goalie.w, goalie.x));
        }

        function kick() {
            if (ball.moving) return;
            ball.moving = true;
            ball.t = 0;
            ball.blocked = false;
            ball.startX = ball.x;
            ball.startY = ball.y;
            ball.targetX = aim.x;
            ball.targetY = aim.y;

            if (currentTurn === 'CPU') {
                // Tópico 8: IA ataca
                const tx = cw * 0.32 + Math.random() * (cw * 0.36);
                const ty = ch * 0.2 + Math.random() * (ch * 0.2);
                ball.targetX = tx;
                ball.targetY = ty;
            }
        }

        function validateGoal() {
            if (ball.blocked) return;

            // Hit Goal Target?
            const inGoal = (ball.x > cw * 0.28 && ball.x < cw * 0.72 && ball.y < ch * 0.48);

            if (inGoal) {
                if (currentTurn === 'PLAYER') pScore++; else cScore++;
                showResult("GOAL");
            } else {
                showResult("OUT");
            }

            updateScoreHUD();

            // Tópico 9: Condição de Vitória (3 Gols)
            setTimeout(() => {
                if (pScore >= 3 || cScore >= 3) {
                    endGameMatch();
                } else {
                    switchTurn();
                }
            }, 1800);
        }

        function showResult(type) {
            const el = document.getElementById('msg');
            const data = { 'GOAL': 'GOOOL!', 'SAVE': 'DEFENDEU!', 'OUT': 'PARA FORA!' };
            el.innerText = data[type];
            el.style.opacity = '1';

            if (type === 'GOAL') {
                document.getElementById('flash-layer').classList.add('flash-fire');
                setTimeout(() => document.getElementById('flash-layer').classList.remove('flash-fire'), 400);
            }
        }

        function updateScoreHUD() {
            document.getElementById('score-p').innerText = pScore;
            document.getElementById('score-c').innerText = cScore;
        }

        function switchTurn() {
            currentTurn = (currentTurn === 'PLAYER') ? 'CPU' : 'PLAYER';
            resetPositions();
            if (currentTurn === 'CPU') {
                setTimeout(kick, 1000);
            }
        }

        function endGameMatch() {
            setScreen('screen-result');
            document.getElementById('hud').classList.add('hidden');

            if (pScore >= 3) {
                document.getElementById('res-title-text').innerText = "VITÓRIA!";
                const stage = STAGES[stageIdx + 1];
                document.getElementById('res-sub-text').innerText = stage ? "RUMO ÀS " + stage.toUpperCase() : "VOCÊ É O CAMPEÃO!";
                document.getElementById('next-btn').classList.remove('hidden');
                document.getElementById('retry-btn').classList.add('hidden');
            } else {
                document.getElementById('res-title-text').innerText = "DERROTA!";
                document.getElementById('res-sub-text').innerText = "FIM DA JORNADA NACIONAL.";
                document.getElementById('next-btn').classList.add('hidden');
                document.getElementById('retry-btn').classList.remove('hidden');
            }
        }

        function advanceTournament() {
            stageIdx++;
            if (stageIdx >= STAGES.length) {
                document.getElementById('champ-club-name').innerText = playerTeam.name.toUpperCase();
                setScreen('screen-finale');
            } else {
                prepareMatchIntro();
            }
        }

        // Tópico 4 & 17: Visual Neon
        function render() {
            ctx.clearRect(0, 0, cw, ch);
            if (gameState === 'MENU' || gameState === 'INTRO') return;

            // Pitch Lines
            ctx.strokeStyle = "rgba(0, 255, 136, 0.1)";
            ctx.lineWidth = 10;
            ctx.strokeRect(cw * 0.25, ch * 0.1, cw * 0.5, ch * 0.85);

            // Goal Net (Tópico 4)
            ctx.fillStyle = "rgba(255, 255, 255, 0.03)";
            ctx.fillRect(cw * 0.28, ch * 0.15, cw * 0.44, ch * 0.1);
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 5;
            ctx.strokeRect(cw * 0.28, ch * 0.15, cw * 0.44, ch * 0.1);

            // Goleiro (Tópico 21)
            const sideColor = currentTurn === 'PLAYER' ? cpuTeam.color : playerTeam.color;
            ctx.fillStyle = sideColor;
            ctx.shadowBlur = 20;
            ctx.shadowColor = sideColor;
            ctx.fillRect(goalie.x, goalie.y, goalie.w, goalie.h);
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
            ctx.strokeRect(goalie.x, goalie.y, goalie.w, goalie.h);
            ctx.shadowBlur = 0;

            // Aim (Tópico 5)
            if (!ball.moving && currentTurn === 'PLAYER') {
                ctx.beginPath();
                ctx.arc(aim.x, aim.y, aim.r, 0, Math.PI * 2);
                ctx.strokeStyle = playerTeam.color;
                ctx.lineWidth = 4;
                ctx.setLineDash([10, 5]);
                ctx.stroke();
                ctx.setLineDash([]);
                // Dot
                ctx.beginPath(); ctx.arc(aim.x, aim.y, 5, 0, Math.PI * 2); ctx.fillStyle = "#fff"; ctx.fill();
            }

            // Ball (Tópico 6)
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
            ctx.fillStyle = "#fff";
            ctx.fill();
            ctx.shadowBlur = 10; ctx.shadowColor = "#fff";
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Penalty Spot
            ctx.beginPath(); ctx.arc(cw / 2, ch * 0.9, 6, 0, Math.PI * 2); ctx.fillStyle = "rgba(255,255,255,0.2)"; ctx.fill();
        }

        window.onload = init;
    </script>
</body>

</html>
